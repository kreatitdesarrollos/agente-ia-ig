name: Agente Instagram

on:
  # Reemplazado por el hub (hub/) + generar.yml: el hub programa, publica y renueva tokens.
  # Queda solo para correr a mano (por ejemplo "verificar").
  workflow_dispatch:
    inputs:
      comando:
        description: "generar / revisar / verificar / renovar-token"
        default: generar
      update:
        description: "(lo completa el portero) mensaje de Telegram que despertó al agente"
        default: ""

concurrency:
  group: agente
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  correr:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      AUTO_PUBLICAR: ${{ vars.AUTO_PUBLICAR || secrets.AUTO_PUBLICAR || 'false' }}
      PORTERO_URL: ${{ vars.PORTERO_URL || 'https://kreatit-portero.federosciano.workers.dev' }}
      TG_UPDATE: ${{ inputs.update }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # la última versión de la rama, no la del momento en que se encoló
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Elegir comando
        id: cmd
        run: |
          case "${{ github.event.schedule }}" in
            "0 12 * * *")  echo "c=generar" >> "$GITHUB_OUTPUT" ;;
            "0 13 1 * *")  echo "c=renovar-token" >> "$GITHUB_OUTPUT" ;;
            "")            echo "c=${{ inputs.comando }}" >> "$GITHUB_OUTPUT" ;;
            *)             echo "c=revisar" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Renovar token (requiere el secreto GH_PAT)
        if: steps.cmd.outputs.c == 'renovar-token'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python agente.py renovar-token | gh secret set IG_TOKEN

      - name: Correr agente
        if: steps.cmd.outputs.c != 'renovar-token'
        run: python agente.py ${{ steps.cmd.outputs.c }}

      - name: Guardar estado e imágenes en el repo
        if: always() && steps.cmd.outputs.c != 'renovar-token'
        run: |
          git config user.name "kreatit-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "agente: ${{ steps.cmd.outputs.c }}"
          # si mientras corría alguien subió cambios (vos u otra ejecución), los trae antes de subir
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            sleep 5
          done
          exit 1
