name: Investigar mercado

# Lo dispara el hub (los miércoles, o con "Investigar ahora" en el panel).
on:
  workflow_dispatch:
    inputs:
      cliente:
        description: "id del cliente (ej. kreatit)"
        required: true

permissions:
  contents: read

jobs:
  investigar:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      HUB_URL: ${{ vars.HUB_URL || 'https://kreatit-portero.federosciano.workers.dev' }}
      CLIENTE: ${{ inputs.cliente }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python investigador.py "$CLIENTE"
