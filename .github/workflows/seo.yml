name: Blog (SEO)

# Lo dispara el hub: artículo de la semana (jueves) o "Escribir artículo" en el panel.
on:
  workflow_dispatch:
    inputs:
      cliente:
        description: "id del cliente"
        required: true
      tema:
        description: "tema (opcional)"
        default: ""

permissions:
  contents: read

jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      HUB_URL: ${{ vars.HUB_URL || 'https://kreatit-portero.federosciano.workers.dev' }}
      CLIENTE: ${{ inputs.cliente }}
      TEMA: ${{ inputs.tema }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python seo.py "$CLIENTE" "$TEMA"
