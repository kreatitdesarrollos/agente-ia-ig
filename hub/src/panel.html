<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel Kreatit</title>
<style>
  :root {
    --fondo: #f4f5fb; --tarjeta: #ffffff; --texto: #1b1d2e; --suave: #5d6178; --borde: #dfe1ec;
    --acento: #4b3fb0; --acento-texto: #ffffff; --ok: #1f8a4c; --peligro: #c23b3b; --aviso: #b26b00;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fondo: #12131c; --tarjeta: #1c1e2b; --texto: #eceefa; --suave: #a2a6c0; --borde: #2e3144;
      --acento: #8f84ff; --acento-texto: #12131c; --ok: #4cc884; --peligro: #ff7b7b; --aviso: #ffb648; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--fondo); color: var(--texto); }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--tarjeta); border-bottom: 1px solid var(--borde); position: sticky; top: 0; z-index: 2; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0 8px 0 0; }
  nav { display: flex; gap: 4px; flex-wrap: wrap; }
  nav button { background: none; border: 0; padding: 8px 12px; border-radius: 8px; color: var(--suave); font: inherit; cursor: pointer; }
  nav button.activo { background: var(--fondo); color: var(--texto); font-weight: 600; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .tarjeta { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .fila { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .grilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .prop img { width: 100%; border-radius: 8px; display: block; background: var(--fondo); }
  .prop .meta { color: var(--suave); font-size: 13px; margin: 8px 0; }
  label { display: block; font-size: 13px; color: var(--suave); margin: 10px 0 4px; }
  input, textarea, select { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--borde); border-radius: 8px; background: var(--fondo); color: var(--texto); }
  textarea { min-height: 120px; resize: vertical; }
  textarea.grande { min-height: 320px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  button.b { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--borde); background: var(--tarjeta); color: var(--texto); cursor: pointer; }
  button.b.prim { background: var(--acento); border-color: var(--acento); color: var(--acento-texto); font-weight: 600; }
  button.b.ok { border-color: var(--ok); color: var(--ok); }
  button.b.peligro { border-color: var(--peligro); color: var(--peligro); }
  button.b:disabled { opacity: .5; cursor: wait; }
  .chip { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--borde); color: var(--suave); }
  .chip.pendiente { border-color: var(--aviso); color: var(--aviso); }
  .chip.publicada { border-color: var(--ok); color: var(--ok); }
  .chip.error { border-color: var(--peligro); color: var(--peligro); }
  .error { color: var(--peligro); font-size: 13px; }
  .vacio { color: var(--suave); text-align: center; padding: 32px; }
  .fotos { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
  .fotos figure { margin: 0; position: relative; }
  .fotos img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; }
  .fotos figcaption { font-size: 11px; color: var(--suave); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fotos button { position: absolute; top: 4px; right: 4px; border: 0; border-radius: 99px; width: 24px; height: 24px; background: #000a; color: #fff; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { text-align: left; padding: 8px; border-bottom: 1px solid var(--borde); vertical-align: top; }
  #login { max-width: 360px; margin: 12vh auto; }
  #aviso { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--texto); color: var(--fondo); padding: 10px 16px; border-radius: 8px; display: none; z-index: 5; max-width: calc(100% - 32px); }
  h2 { font-size: 16px; margin: 0 0 8px; }
  /* ---- oficina ---- */
  .piso { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; padding: 14px; border-radius: 14px;
    background-color: var(--piso1); background-image: linear-gradient(45deg, var(--piso2) 25%, transparent 25%, transparent 75%, var(--piso2) 75%),
    linear-gradient(45deg, var(--piso2) 25%, transparent 25%, transparent 75%, var(--piso2) 75%); background-size: 32px 32px; background-position: 0 0, 16px 16px; }
  :root { --piso1: #e9e4f5; --piso2: #e1dbef; }
  @media (prefers-color-scheme: dark) { :root { --piso1: #1f2030; --piso2: #23253a; } }
  #oSala .puesto { cursor: pointer; }
  #oSala .puesto:hover .cartelito rect, #oSala .puesto:focus .cartelito rect { stroke-width: 3; }
  #oSala .puesto:focus { outline: none; }
  .puesto svg { width: 100%; height: auto; display: block; image-rendering: pixelated; }
  .globo { position: relative; background: var(--fondo); border: 1px solid var(--borde); border-radius: 10px; padding: 6px 9px; font-size: 12px; min-height: 34px; margin-bottom: 6px; color: var(--texto); }
  .globo:after { content: ""; position: absolute; left: 34px; bottom: -6px; width: 10px; height: 10px; background: var(--fondo); border-right: 1px solid var(--borde); border-bottom: 1px solid var(--borde); transform: rotate(45deg); }
  .cartel { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: 6px; }
  .cartel b { font-size: 13px; }
  .estado { font-size: 11px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--borde); white-space: nowrap; }
  .estado.trabajando { border-color: var(--ok); color: var(--ok); }
  .estado.esperando { border-color: var(--aviso); color: var(--aviso); }
  .estado.error { border-color: var(--peligro); color: var(--peligro); }
  .insignia { position: absolute; top: -8px; right: -8px; background: var(--aviso); color: #fff; border-radius: 99px; min-width: 24px; height: 24px; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
  .trabajando .brazo-i { animation: tecleo .35s infinite; } .trabajando .brazo-d { animation: tecleo .35s infinite .17s; }
  .trabajando .linea { animation: parpadeo 1.2s infinite; } .trabajando .linea:nth-child(2n) { animation-delay: .4s; }
  .esperando .mano { animation: saludo 1s infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  .brazo-i, .brazo-d { transform-box: fill-box; }
  .descanso .vapor path { animation: vapor 2.4s infinite; } .descanso .vapor path:nth-child(2) { animation-delay: .8s; }
  .descanso .cuerpo { animation: respirar 3s infinite; } .error .alerta { animation: parpadeo .8s infinite; }
  @keyframes tecleo { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
  @keyframes parpadeo { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  @keyframes saludo { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(14deg); } }
  @keyframes vapor { 0% { opacity: 0; transform: translateY(0); } 40% { opacity: .9; } 100% { opacity: 0; transform: translateY(-7px); } }
  @keyframes respirar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(1px); } }
  #actores .brazo-i, #actores .brazo-d { transform-box: fill-box; transform-origin: 50% 0; }
  .sentado-teclea .brazo-i { animation: tecleo .35s infinite; } .sentado-teclea .brazo-d { animation: tecleo .35s infinite .17s; }
  .piernas-caminan .pierna-i { animation: paso .5s infinite; transform-box: fill-box; transform-origin: 50% 0; }
  .piernas-caminan .pierna-d { animation: paso .5s infinite reverse; transform-box: fill-box; transform-origin: 50% 0; }
  .brazos-caminan .brazo-i { animation: paso .5s infinite reverse; } .brazos-caminan .brazo-d { animation: paso .5s infinite; }
  .parado-espera .mano { animation: saludo 1s infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  .parado-pizarra .escribe { animation: escribe 1.2s infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  .sentado-taza .vapor path, .parado-taza .vapor path { animation: vapor 2.4s infinite; }
  .sentado-taza .vapor path:nth-child(2), .parado-taza .vapor path:nth-child(2) { animation-delay: .8s; }
  .sentado-error > rect:nth-of-type(2) { animation: respirar 1.5s infinite; }
  @keyframes paso { 0%, 100% { transform: rotate(18deg); } 50% { transform: rotate(-18deg); } }
  @keyframes escribe { 0%, 100% { transform: rotate(-8deg) translateY(0); } 50% { transform: rotate(10deg) translateY(-2px); } }
  @media (prefers-reduced-motion: reduce) { .puesto *, #actores * { animation: none !important; } }
  .modal { position: fixed; inset: 0; background: #0008; display: grid; place-items: start center; padding: 6vh 16px; z-index: 6; overflow-y: auto; }
  .modal > div { background: var(--tarjeta); border-radius: 14px; padding: 18px; width: min(720px, 100%); }
  h3 { font-size: 14px; margin: 16px 0 8px; }
</style>
</head>
<body>
<div id="login" class="tarjeta" hidden>
  <h2>Panel de la agencia</h2>
  <p>Ingresá tu usuario y te mandamos un código a tu Telegram.</p>
  <label for="usuario">Usuario</label>
  <input id="usuario" autocomplete="username" autocapitalize="none">
  <p><button class="b prim" id="pedirCodigo">Enviarme el código</button></p>
  <div id="pasoCodigo" hidden>
    <label for="codigo">Código</label>
    <input id="codigo" inputmode="numeric" autocomplete="one-time-code">
    <p><button class="b prim" id="entrar">Entrar</button></p>
  </div>
  <p class="error" id="errorLogin"></p>
</div>

<div id="app" hidden>
  <header>
    <h1>Panel</h1>
    <nav>
      <button data-vista="oficina" class="activo">Oficina</button>
      <button data-vista="propuestas">Para aprobar</button>
      <button data-vista="historial">Historial</button>
      <button data-vista="generar">Generar</button>
      <button data-vista="resultados">Resultados</button>
      <button data-vista="investigacion">Investigación</button>
      <button data-vista="leads">Leads</button>
      <button data-vista="prospeccion">Prospección</button>
      <button data-vista="anuncios">Anuncios</button>
      <button data-vista="comentarios">Comentarios</button>
      <button data-vista="resenas">Reseñas</button>
      <button data-vista="clientes">Clientes</button>
      <button data-vista="seguridad">Seguridad</button>
      <button data-vista="actividad">Actividad</button>
      <button data-vista="ayuda">Ayuda</button>
    </nav>
    <span style="flex:1"></span>
    <span id="quien" style="color:var(--suave);font-size:13px"></span>
    <button class="b" id="salir">Salir</button>
  </header>
  <main id="vista"></main>
</div>
<div id="aviso"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let clientes = [];
let yo = null;
let igOauth = false;

async function api(ruta, opciones = {}) {
  const r = await fetch("/api/panel/" + ruta, {
    ...opciones,
    headers: opciones.body instanceof FormData ? {} : { "Content-Type": "application/json" },
    body: opciones.body instanceof FormData ? opciones.body : opciones.body && JSON.stringify(opciones.body),
  });
  if (r.status === 401) { mostrarLogin(); throw new Error("sin sesión"); }
  const j = r.headers.get("Content-Type")?.includes("json") ? await r.json() : null;
  if (!r.ok || j?.error) throw new Error(j?.error || "error " + r.status);
  return j;
}

function aviso(texto) {
  const a = $("#aviso");
  a.textContent = texto;
  a.style.display = "block";
  clearTimeout(aviso.t);
  aviso.t = setTimeout(() => (a.style.display = "none"), 3500);
}

async function conBoton(boton, fn) {
  boton.disabled = true;
  try { await fn(); } catch (e) { aviso("⚠️ " + e.message); } finally { boton.disabled = false; }
}

// ---------- login
function mostrarLogin() { $("#app").hidden = true; $("#login").hidden = false; }
try { $("#usuario").value = localStorage.getItem("usuario") || ""; } catch {}
$("#pedirCodigo").onclick = () => conBoton($("#pedirCodigo"), async () => {
  const usuario = $("#usuario").value.trim();
  if (!usuario) return aviso("Escribí tu usuario");
  try { localStorage.setItem("usuario", usuario); } catch {}
  await fetch("/api/panel/codigo", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ usuario }) });
  $("#pasoCodigo").hidden = false;
  $("#errorLogin").textContent = "Si el usuario existe y tiene Telegram vinculado, te llegó el código.";
  $("#codigo").focus();
});
$("#entrar").onclick = () => conBoton($("#entrar"), async () => {
  const r = await fetch("/api/panel/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ usuario: $("#usuario").value.trim(), codigo: $("#codigo").value.trim() }) });
  if (!r.ok) { $("#errorLogin").textContent = (await r.json()).error; return; }
  iniciar();
});
$("#codigo").addEventListener("keydown", (e) => e.key === "Enter" && $("#entrar").click());
$("#salir").onclick = async () => { await api("salir", { method: "POST" }); mostrarLogin(); };

// ---------- navegación
document.querySelectorAll("nav button").forEach((b) => (b.onclick = () => ir(b.dataset.vista)));
let relojOficina = null;
function ir(vista) {
  clearInterval(relojOficina);
  if (vida.raf) { cancelAnimationFrame(vida.raf); vida.raf = null; }
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("activo", b.dataset.vista === vista));
  try { localStorage.setItem("vista", vista); } catch {}
  ({ propuestas: () => verPropuestas("pendiente"), historial: () => verPropuestas("todas"), generar: verGenerar, resultados: verResultados, investigacion: verInvestigacion, comentarios: verComentarios, resenas: verResenas, leads: verLeads, prospeccion: verProspeccion, anuncios: verAnuncios, ayuda: verAyuda, oficina: verOficina, seguridad: verSeguridad, clientes: verClientes, actividad: verActividad })[vista]();
}

async function iniciar() {
  try {
    const r = await api("resumen");
    clientes = r.clientes; yo = r.yo; igOauth = r.ig_oauth;
  } catch { return; }
  $("#login").hidden = true;
  $("#app").hidden = false;
  $("#quien").textContent = yo.nombre;
  $('nav [data-vista="clientes"]').textContent = yo.rol === "agencia" ? "Clientes" : "Mi cuenta";
  const ig = decodeURIComponent((location.hash.match(/ig=([^&]+)/) || [])[1] || "");
  if (ig) { aviso(ig); history.replaceState(null, "", location.pathname); try { localStorage.setItem("vista", "clientes"); } catch {} }
  let vista = "oficina";
  try { vista = localStorage.getItem("vista") || vista; } catch {}
  ir(vista);
}

const opcionesClientes = (sel = "") => clientes.map((c) => `<option value="${esc(c.id)}" ${c.id === sel ? "selected" : ""}>${esc(c.nombre)}</option>`).join("");

// ---------- propuestas
async function verPropuestas(estado) {
  const v = $("#vista");
  v.innerHTML = `<div class="fila" style="margin-bottom:16px">
      <select id="filtroCliente" style="max-width:260px" ${yo.rol === "agencia" ? "" : "hidden"}><option value="">Todos los clientes</option>${opcionesClientes()}</select>
      ${estado === "todas" ? "" : '<span class="meta" style="color:var(--suave)">Posts esperando tu aprobación</span>'}
    </div><div id="lista" class="grilla"></div>`;
  $("#filtroCliente").onchange = () => cargar();
  async function cargar() {
    const lista = await api(`propuestas?estado=${estado}&cliente=${$("#filtroCliente").value}`);
    $("#lista").innerHTML = lista.length ? "" : `<div class="vacio">${estado === "pendiente" ? "No hay nada para aprobar 🎉" : "Todavía no hay historial"}</div>`;
    for (const p of lista) $("#lista").append(tarjetaPropuesta(p, cargar));
  }
  await cargar();
}

// Cada tarjeta muestra además lo que dijo el revisor de calidad.
function tarjetaPropuesta(p, recargar) {
  const el = tarjetaSegunTipo(p, recargar);
  const r = p.datos.revision;
  if (p.estado === "pendiente") {
    const caja = document.createElement("div");
    caja.style.cssText = "margin-top:10px;padding:8px 10px;border-radius:8px;font-size:13px;border:1px solid var(--borde)";
    caja.innerHTML = !r ? '<span class="meta">🔎 El revisor de calidad lo está leyendo…</span>'
      : r.ok ? `<span style="color:var(--ok)">✅ Revisado: sin problemas${r.corregido ? " (con la corrección aplicada)" : ""}</span>`
      : `<b style="color:var(--aviso)">⚠️ El revisor encontró:</b><ul style="margin:4px 0">${r.problemas.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` +
        (r.sugerencia ? `<details><summary style="cursor:pointer">Ver corrección propuesta</summary><p style="white-space:pre-wrap">${esc(r.sugerencia)}</p></details><button class="b" data-corr>✍️ Usar corrección</button>` : "");
    el.append(caja);
    const b = caja.querySelector("[data-corr]");
    if (b) b.onclick = () => conBoton(b, async () => { await api(`propuestas/${p.id}/corregir`, { method: "POST", body: {} }); aviso("Corrección aplicada"); recargar(); });
  }
  return el;
}

function tarjetaSegunTipo(p, recargar) {
  if (p.tipo === "respuesta") return tarjetaRespuesta(p, recargar);
  if (p.tipo === "mensaje") return tarjetaMensaje(p, recargar);
  if (p.tipo === "resena") return tarjetaResena(p, recargar);
  if (p.tipo === "email") return tarjetaEmail(p, recargar);
  if (p.tipo === "anuncio") return tarjetaAnuncio(p, recargar);
  if (p.tipo === "prospecto") return tarjetaProspecto(p, recargar);
  const el = document.createElement("div");
  el.className = "tarjeta prop";
  const editable = p.estado === "pendiente" || p.estado === "error";
  el.innerHTML = `
    <img src="/img/${esc(p.id)}.jpg" alt="Imagen del post" loading="lazy">
    <div class="meta"><span class="chip ${esc(p.estado)}">${esc(p.estado)}</span> ${esc(p.cliente_nombre)} · ${esc(p.creado)} UTC</div>
    <h2>${esc(p.titulo)}</h2>
    ${editable ? `<label>Texto</label><textarea class="caption">${esc(p.datos.caption)}</textarea>
      <label>Hashtags</label><input class="hashtags" value="${esc(p.datos.hashtags)}">` :
      `<p style="white-space:pre-wrap">${esc(p.datos.caption)}</p><p class="meta">${esc(p.datos.hashtags)}</p>`}
    ${p.resultado.error ? `<p class="error">${esc(p.resultado.error)}</p>` : ""}
    ${p.resultado.enlace ? `<p><a href="${esc(p.resultado.enlace)}" target="_blank" rel="noopener">Ver en Instagram ↗</a></p>` : ""}
    <div class="fila" style="margin-top:12px">${
      p.estado === "pendiente" ? `<button class="b prim" data-a="aprobar">✅ Publicar</button><button class="b" data-a="otra">🔄 Otra</button><button class="b peligro" data-a="descartar">Descartar</button>` :
      p.estado === "error" ? `<button class="b prim" data-a="reintentar">Reintentar</button><button class="b peligro" data-a="descartar">Descartar</button>` : ""}
    </div>`;
  el.querySelectorAll("[data-a]").forEach((b) => (b.onclick = () => conBoton(b, async () => {
    const cambios = editable ? { caption: $(".caption", el).value, hashtags: $(".hashtags", el).value } : {};
    const r = await api(`propuestas/${p.id}/${b.dataset.a}`, { method: "POST", body: cambios });
    aviso(r.enlace ? "🚀 Publicado" : r.nota || (b.dataset.a === "otra" ? "Generando otra versión (1–2 min)" : "Listo"));
    recargar();
  })));
  return el;
}

const ICONOS = { pregunta: "❓", elogio: "💜", queja: "⚠️", compra: "🛒", spam: "🚫", otro: "💬" };

function tarjetaRespuesta(p, recargar) {
  const d = p.datos;
  const el = document.createElement("div");
  el.className = "tarjeta prop";
  const editable = p.estado === "pendiente" || p.estado === "error";
  const ocultar = d.accion === "ocultar";
  el.innerHTML = `
    <div class="meta"><span class="chip ${esc(p.estado)}">${esc(p.estado)}</span> ${esc(p.cliente_nombre)} · ${esc(p.creado)} UTC
      ${d.urgente ? '<span class="chip error">urgente</span>' : ""}</div>
    <h2>${ICONOS[d.categoria] || "💬"} @${esc(d.usuario)} <span class="chip">${esc(d.categoria || "")}</span></h2>
    ${d.post ? `<p class="meta">En: "${esc(d.post.split("\n")[0])}"</p>` : ""}
    <p style="white-space:pre-wrap;border-left:3px solid var(--borde);padding-left:10px">${esc(d.comentario)}</p>
    ${ocultar ? `<p><b>Sugerencia:</b> ocultar el comentario (spam u ofensivo).</p>` :
      editable ? `<label>Respuesta</label><textarea class="respuesta" style="min-height:90px">${esc(d.respuesta)}</textarea>` :
      `<p><b>Respuesta:</b> ${esc(d.respuesta)}</p>`}
    ${p.resultado.error ? `<p class="error">${esc(p.resultado.error)}</p>` : ""}
    <div class="fila" style="margin-top:12px">${
      p.estado === "pendiente" ? `<button class="b prim" data-a="aprobar">${ocultar ? "🙈 Ocultar" : "✅ Responder"}</button><button class="b" data-a="otra">🔄 Otra</button><button class="b peligro" data-a="descartar">Ignorar</button>` :

    $("#pCuerpo").querySelectorAll("[data-ver]").forEach((b) => (b.onclick = () => conBoton(b, async () => {

          <td><span class="chip">${esc(ESTADOS_PROSPECTO[x.estado] || x.estado)}${x.paso ? " · seg. " + x.paso : ""}</span></td><td class="meta">${esc(x.resumen || "")}</td><td class="meta">${esc(x.ultimo_envio || "")}</td></tr>`).join("")}</tbody></table></div>` : '<p class="vacio">Sin prospectos todavía.</p>';

    $("#iInformes").innerHTML = informes.length ? informes.map((inf) => {
      const d = inf.datos;
      return `<div class="tarjeta"><h2>Informe del ${esc(inf.creado.slice(0, 10))}</h2>
        <p>${conLinks(d.resumen || "", d)}</p>
        ${lista("🏁 Competencia", d.competencia, d)}${lista("📈 Tendencias y oportunidades", d.tendencias, d)}${lista("📅 Fechas para aprovechar", d.fechas, d)}
        <h3>💡 Ideas de posts</h3>${(d.ideas || []).map((idea, n) => `<div class="fila" style="margin-bottom:8px;align-items:flex-start">
          <div style="flex:1"><b>${esc(idea.titulo)}</b><br><span class="meta" style="color:var(--suave)">${conLinks(idea.enfoque, d)}</span></div>
          <button class="b" data-idea="${inf.id}/${n}">✨ Generar este post</button></div>`).join("")}
        <details><summary style="cursor:pointer;color:var(--suave);font-size:13px">Fuentes (${(d.fuentes || []).length})</summary><ol>${
          (d.fuentes || []).map((f) => `<li><a href="${esc(f.link)}" target="_blank" rel="noopener">${esc(f.titulo)}</a> <span class="meta">— ${esc(f.fuente)}, ${esc(f.fecha)}</span></li>`).join("")}</ol></details>
      </div>`;
    }).join("") : '<div class="tarjeta vacio">Todavía no hay informes. Cargá temas o competidores y tocá "Investigar ahora".</div>';
    $("#iInformes").querySelectorAll("[data-idea]").forEach((b) => (b.onclick = () => conBoton(b, async () => {

  el.querySelectorAll("[data-reinv]").forEach((b) => (b.onclick = () => conBoton(b, async () => {

  });

const ASPECTO = {
  redactor: { camisa: "#e76f51", pelo: "#3b2a20", piel: "#f1c27d" },
  community: { camisa: "#2a9d8f", pelo: "#e9c46a", piel: "#ffdbac" },

  atencion: { camisa: "#f4a261", pelo: "#1d1d1d", piel: "#e0ac69" },
  emails: { camisa: "#8e7dbe", pelo: "#a0522d", piel: "#ffdbac" },
  analista: { camisa: "#457b9d", pelo: "#2b2b2b", piel: "#8d5524" },
  investigador: { camisa: "#6a994e", pelo: "#c9c9c9", piel: "#f1c27d" },
  trafficker: { camisa: "#d62828", pelo: "#ffb703", piel: "#e0ac69" },
  prospector: { camisa: "#0077b6", pelo: "#5e3023", piel: "#f1c27d" },
  seguridad: { camisa: "#212529", pelo: "#111111", piel: "#c68642" },
};
const ICONO_AGENTE = { redactor: "✍️", community: "💬", vendedor: "🤝", atencion: "⭐", emails: "✉️", analista: "📊", investigador: "🔎", trafficker: "📣", prospector: "📨", seguridad: "🛡️" };
const TEXTO_ESTADO = { trabajando: "trabajando", esperando: "esperando tu OK", descanso: "tomando un café", error: "con un problema" };

// Oficina isométrica: una sala con los 8 agentes en sus escritorios. Todo dibujado en SVG (sin imágenes externas).
const ISO = { s: 34, ox: 400, oy: 150, c: 0.866 };
const P = (x, y, z = 0) => [ISO.ox + (x - y) * ISO.s * ISO.c, ISO.oy + (x + y) * ISO.s * 0.5 - z * ISO.s];
const pts = (...ps) => ps.map((p) => p.map((n) => n.toFixed(1)).join(",")).join(" ");
const poli = (color, ...ps) => `<polygon points="${pts(...ps)}" fill="${color}"/>`;
// Caja isométrica: tapa, frente (mira a +y) y costado (mira a +x).
function caja(x, y, z, w, d, h, tapa, frente, costado) {
  return poli(costado, P(x + w, y, z), P(x + w, y + d, z), P(x + w, y + d, z + h), P(x + w, y, z + h)) +
    poli(frente, P(x, y + d, z), P(x + w, y + d, z), P(x + w, y + d, z + h), P(x, y + d, z + h)) +
    poli(tapa, P(x, y, z + h), P(x + w, y, z + h), P(x + w, y + d, z + h), P(x, y + d, z + h));
}
// Planta en maceta.
const planta = (x, y, alto = 1) => caja(x, y, 0, 0.5, 0.5, 0.45, "#b5651d", "#8b4513", "#a0522d") +
  [[-14, -10], [0, -20], [14, -10], [-7, -26], [8, -27]].map(([dx, dy], k) => {
    const [px, py] = P(x + 0.25, y + 0.25, 0.45);
    return `<ellipse cx="${px + dx * alto}" cy="${py + dy * alto}" rx="${9 * alto}" ry="${5 * alto}" fill="${k % 2 ? "#2d6a4f" : "#40916c"}" transform="rotate(${dx * 2} ${px + dx * alto} ${py + dy * alto})"/>`;
  }).join("");

const PUESTOS = { redactor: [1.6, 2.2], community: [5.4, 2.2], vendedor: [9.2, 2.2], atencion: [13, 2.2], prospector: [16.8, 2.2],
  emails: [1.6, 6.4], analista: [5.4, 6.4], investigador: [9.2, 6.4], trafficker: [13, 6.4], seguridad: [16.8, 6.4] };

// Lo fijo de cada puesto: escritorio, monitor (según el estado real), teclado, taza y silla.
function puestoFijo(a) {
  const [dx, dy] = PUESTOS[a.id];
  const pantalla = a.estado === "trabajando" ? "#1e6091" : a.estado === "error" ? "#9b2226" : "#1b1e2b";
  let g = caja(dx, dy, 0, 1.9, 1.0, 0.72, "#c8a27a", "#9c6b3f", "#b07d4f");
  g += caja(dx + 0.55, dy + 0.18, 0.72, 0.8, 0.08, 0.55, "#2b2d3a", "#2b2d3a", "#3a3d4f");
  g += poli(pantalla, P(dx + 0.6, dy + 0.27, 0.78), P(dx + 1.3, dy + 0.27, 0.78), P(dx + 1.3, dy + 0.27, 1.22), P(dx + 0.6, dy + 0.27, 1.22));
  if (a.estado === "trabajando") {
    for (let k = 0; k < 4; k++) {
      const [x1, y1] = P(dx + 0.66, dy + 0.27, 1.15 - k * 0.09), [x2, y2] = P(dx + 0.66 + 0.25 + ((k * 0.17) % 0.35), dy + 0.27, 1.15 - k * 0.09);
      g += `<line class="linea" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#90e0ef" stroke-width="2"/>`;
    }
  }
  g += caja(dx + 0.6, dy + 0.55, 0.72, 0.7, 0.25, 0.03, "#e9ecef", "#ced4da", "#dee2e6");
  g += caja(dx + 1.5, dy + 0.4, 0.72, 0.16, 0.16, 0.18, "#fff", "#e9ecef", "#dee2e6");
  const [sx, sy] = P(dx + 0.95, dy + 1.55, 0);
  g += `<rect x="${sx - 2}" y="${sy - 16}" width="4" height="16" fill="#495057"/><ellipse cx="${sx}" cy="${sy}" rx="12" ry="4" fill="#343a40"/><rect x="${sx - 12}" y="${sy - 24}" width="24" height="18" rx="4" fill="#1d3557"/>`;
  return `<g class="${a.estado}">${g}</g>`;
}

// El cartel con nombre y estado, y la zona para tocar el puesto.
function cartelPuesto(a) {
  const [dx, dy] = PUESTOS[a.id];
  const [bx, by] = P(dx + 0.95, dy + 0.5, 2.6);
  const colorEstado = { trabajando: "#2a9d8f", esperando: "#e76f51", descanso: "#6c757d", error: "#d62828" }[a.estado];
  const corto = { trabajando: "trabajando…", esperando: `esperando tu OK${a.pendientes ? " (" + a.pendientes + ")" : ""}`, descanso: "☕ en pausa", error: "⚠️ tuvo un problema" }[a.estado];
  let g = `<g class="cartelito"><rect x="${bx - 62}" y="${by - 30}" width="124" height="34" rx="8" fill="var(--tarjeta)" stroke="${colorEstado}" stroke-width="1.5"/>
    <path d="M${bx - 5} ${by + 4} l5 7 l5 -7 z" fill="${colorEstado}"/>
    <text x="${bx}" y="${by - 15}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--texto)">${ICONO_AGENTE[a.id]} ${esc(a.nombre.split(" ")[0])}</text>
    <text x="${bx}" y="${by - 2}" text-anchor="middle" font-size="10" fill="${colorEstado}">${esc(corto)}</text></g>`;
  if (a.pendientes) g += `<circle cx="${bx + 60}" cy="${by - 30}" r="10" fill="#e76f51"/><text x="${bx + 60}" y="${by - 26.5}" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">${a.pendientes}</text>`;
  if (a.estado === "error") g += `<g class="alerta"><circle cx="${bx - 60}" cy="${by - 30}" r="10" fill="#d62828"/><text x="${bx - 60}" y="${by - 26}" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">!</text></g>`;
  const [hx, hy] = P(dx + 0.95, dy + 0.9, 0.6);
  g += `<rect x="${hx - 62}" y="${by - 34}" width="124" height="${hy - by + 60}" fill="transparent"/>`;
  return `<g class="puesto ${a.estado}" data-agente="${a.id}" role="button" tabindex="0" aria-label="${esc(a.nombre)}: ${esc(TEXTO_ESTADO[a.estado])}. ${esc(a.globo)}"><title>${esc(a.nombre)} — ${esc(a.globo || a.tarea)}</title>${g}</g>`;
}

// ---------- vida en la oficina: cada agente es un personaje que se mueve según su estado real
const LUGARES = {
  cafe: [[1.3, 7.8], [1.3, 8.7], [0.55, 7.15]],        // al lado de la cafetera (hasta 3 a la vez)
  ventana: [[4.45, 1.05], [8.25, 1.05], [12.05, 1.05], [15.85, 1.05]], // frente a los ventanales, entre los escritorios de atrás
  pizarra: [[0.75, 2.9]],
};
const PASILLO = 5.0; // el pasillo entre las dos filas de escritorios
const VELOCIDAD = 1.3; // unidades por segundo
const vida = { actores: {}, raf: null, ultimo: 0 };

const silla = (id) => { const [dx, dy] = PUESTOS[id]; return [dx + 0.95, dy + 1.55]; };
const alLado = (id) => { const [dx, dy] = PUESTOS[id]; return [dx + 2.35, dy + 0.9]; }; // donde espera parado tu OK
const deAdelante = (id) => PUESTOS[id][1] > PASILLO;

// Camino por los pasillos desde donde está hasta un destino (evita atravesar escritorios).
function ruta(act, destino, aSilla = false) {
  const [x0, y0] = act.pos, [xd, yd] = destino;
  const salir = [];
  if (act.modo.startsWith("sentado") && deAdelante(act.id)) salir.push([PUESTOS[act.id][0] - 0.35, y0], [PUESTOS[act.id][0] - 0.35, PASILLO]);
  else if (Math.abs(y0 - PASILLO) > 0.01) salir.push([x0, PASILLO]);
  const llegar = [];
  if (aSilla && deAdelante(act.id)) llegar.push([PUESTOS[act.id][0] - 0.35, PASILLO], [PUESTOS[act.id][0] - 0.35, yd]);
  else llegar.push([xd, PASILLO]);
  return [...salir, ...llegar, destino];
}

function ocupar(lugar, id) {
  const usados = Object.values(vida.actores).filter((a) => a.id !== id && a.lugar).map((a) => a.lugar);
  const libre = LUGARES[lugar].findIndex((_, k) => !usados.includes(lugar + k));
  return libre < 0 ? null : lugar + libre;
}

function irA(act, lugarId, modoAlLlegar, segundos) {
  const [nombre, k] = [lugarId.replace(/\d+$/, ""), Number(lugarId.match(/\d+$/)[0])];
  act.lugar = lugarId;
  act.camino = ruta(act, LUGARES[nombre][k]);
  act.modo = "caminando";
  act.alLlegar = { modo: modoAlLlegar, segundos };
}

function volverAlPuesto(act, modo) {
  act.lugar = null;
  act.camino = modo === "parado-espera" ? ruta(act, alLado(act.id)) : ruta(act, silla(act.id), true);
  act.modo = "caminando";
  act.alLlegar = { modo, segundos: 0 };
}

const azar = (a, b) => a + Math.random() * (b - a);

// Qué hace cada uno cuando termina lo que estaba haciendo (o cuando cambia su estado real).
function decidir(act, ahora) {
  const m = act.modo, sentado = m.startsWith("sentado");
  if (m === "caminando") return;
  if (act.estado === "esperando") {
    if (m === "parado-espera") return (act.hasta = ahora + 60000);
    return volverAlPuesto(act, "parado-espera");
  }
  if (act.estado === "error") {
    if (sentado) { act.modo = "sentado-error"; return (act.hasta = ahora + 60000); }
    return volverAlPuesto(act, "sentado-error");
  }
  if (act.estado === "trabajando") {
    if (m === "parado-pizarra" || !sentado) return volverAlPuesto(act, "sentado-teclea");
    if (act.id === "investigador" && m === "sentado-teclea" && Math.random() < 0.3) {
      const lugar = ocupar("pizarra", act.id);
      if (lugar) return irA(act, lugar, "parado-pizarra", azar(15, 25));
    }
    act.modo = m === "sentado-teclea" && Math.random() < 0.3 ? "sentado-estira" : "sentado-teclea";
    return (act.hasta = ahora + (act.modo === "sentado-estira" ? 2500 : azar(12000, 30000)));
  }
  // en pausa: café en el escritorio, ir a la cafetera, mirar por la ventana o volver a sentarse
  if (!sentado) return volverAlPuesto(act, "sentado-taza");
  const r = Math.random();
  if (r < 0.2) { const l = ocupar("cafe", act.id); if (l) return irA(act, l, "parado-taza", azar(15, 30)); }
  if (r < 0.3) { const l = ocupar("ventana", act.id); if (l) return irA(act, l, "parado-ventana", azar(10, 20)); }
  act.modo = "sentado-taza";
  act.hasta = ahora + azar(15000, 40000);
}

// Avanza a los que caminan y decide cuando se cumple el tiempo de cada uno.
function avanzarVida(ahora) {
  const dt = Math.min(0.1, (ahora - (vida.ultimo || ahora)) / 1000);
  vida.ultimo = ahora;
  for (const act of Object.values(vida.actores)) {
    if (act.modo === "caminando") {
      let paso = VELOCIDAD * dt;
      while (paso > 0 && act.camino.length) {
        const [tx, ty] = act.camino[0];
        const ddx = tx - act.pos[0], ddy = ty - act.pos[1], dist = Math.hypot(ddx, ddy);
        if (dist <= paso) { act.pos = [tx, ty]; act.camino.shift(); paso -= dist; }
        else { act.pos = [act.pos[0] + (ddx / dist) * paso, act.pos[1] + (ddy / dist) * paso]; act.dir = [ddx, ddy]; paso = 0; }
      }
      if (!act.camino.length) {
        act.modo = act.alLlegar.modo;
        act.hasta = ahora + (act.alLlegar.segundos ? act.alLlegar.segundos * 1000 : azar(8000, 18000));
        if (act.modo.startsWith("sentado")) act.pos = silla(act.id);
        const paseo = act.modo === "parado-taza" || act.modo === "parado-ventana";
        if ((paseo && act.estado !== "descanso") || (act.modo === "parado-espera") !== (act.estado === "esperando")) act.hasta = ahora;
      }
    } else if (ahora >= act.hasta) decidir(act, ahora);
  }
}

// Dibujo de cada personaje según lo que está haciendo (origen: los pies, o el asiento si está sentado).
function figura(act) {
  const { camisa, pelo, piel } = ASPECTO[act.id];
  const m = act.modo;
  const sentado = m.startsWith("sentado");
  // de frente cuando camina hacia el espectador (abajo en pantalla) o está parado esperando
  const [sdx, sdy] = act.dir ? [(act.dir[0] - act.dir[1]) * 0.866, (act.dir[0] + act.dir[1]) * 0.5] : [0, -1];
  const deFrente = m === "parado-espera" || m === "parado-taza" || (m === "caminando" && sdy > 0.05);
  const espejo = m === "caminando" && sdx < 0 ? -1 : 1;
  const cuerpoY = sentado ? -24 : -38, cabezaY = cuerpoY - 8;
  let f = "";
  if (!sentado) {
    f += `<g class="${m === "caminando" ? "piernas-caminan" : ""}"><rect class="pierna-i" x="-7" y="-16" width="6" height="16" fill="#343a40"/><rect class="pierna-d" x="1" y="-16" width="6" height="16" fill="#343a40"/></g>`;
  }
  f += `<rect x="-9" y="${cuerpoY}" width="18" height="${sentado ? 24 : 22}" rx="5" fill="${camisa}"/>`;
  f += `<circle cx="0" cy="${cabezaY}" r="8" fill="${piel}"/>`;
  f += deFrente ? `<path d="M-8 ${cabezaY} a8 8 0 0 1 16 0 l0 -2 z" fill="${pelo}"/><rect x="-4" y="${cabezaY - 1}" width="2" height="2" fill="#222"/><rect x="2" y="${cabezaY - 1}" width="2" height="2" fill="#222"/><rect x="-2" y="${cabezaY + 3}" width="4" height="1.5" fill="#a0522d"/>`
    : `<path d="M-8 ${cabezaY + 1} a8 8 0 0 1 16 0 z" fill="${pelo}"/>`;
  const brazo = (x, y, h, extra = "") => `<rect ${extra} x="${x}" y="${y}" width="5" height="${h}" rx="2" fill="${camisa}"/>`;
  const taza = (x, y) => `<rect x="${x}" y="${y}" width="7" height="8" rx="1" fill="#fff"/><g class="vapor" fill="none" stroke="#adb5bd" stroke-width="1.5"><path d="M${x + 2} ${y - 2} q2 -3 0 -6"/><path d="M${x + 5} ${y - 2} q2 -3 0 -6"/></g>`;
  if (m === "sentado-teclea") f += brazo(-13, cuerpoY + 3, 13, 'class="brazo-i"') + brazo(8, cuerpoY + 3, 13, 'class="brazo-d"');
  else if (m === "sentado-estira") f += brazo(-12, cuerpoY - 18, 20) + brazo(7, cuerpoY - 18, 20);
  else if (m === "sentado-taza") f += brazo(-13, cuerpoY + 3, 13) + brazo(7, cuerpoY - 4, 12) + taza(9, cuerpoY - 12);
  else if (m === "sentado-error") f += brazo(-12, cuerpoY - 12, 14) + brazo(7, cuerpoY - 12, 14);
  else if (m === "parado-espera") f += brazo(-13, cuerpoY + 3, 15) + `<g class="mano">${brazo(8, cuerpoY - 18, 20)}<circle cx="10.5" cy="${cuerpoY - 20}" r="3.5" fill="${piel}"/></g>`;
  else if (m === "parado-taza") f += brazo(-13, cuerpoY + 3, 15) + brazo(7, cuerpoY - 4, 12) + taza(9, cuerpoY - 12);
  else if (m === "parado-pizarra") f += brazo(-13, cuerpoY + 3, 15) + `<g class="escribe">${brazo(-14, cuerpoY - 16, 18)}</g>`;
  else if (m === "caminando") f += `<g class="brazos-caminan">${brazo(-13, cuerpoY + 3, 14, 'class="brazo-i"')}${brazo(8, cuerpoY + 3, 14, 'class="brazo-d"')}</g>`;
  else f += brazo(-13, cuerpoY + 3, 15) + brazo(8, cuerpoY + 3, 15);
  if (sentado) f += `<rect x="-12" y="-8" width="24" height="18" rx="4" fill="#1d3557"/>`; // respaldo de la silla
  const charla = m === "parado-taza" && Object.values(vida.actores).filter((a) => a.modo === "parado-taza").length > 1;
  if (charla) f += `<text x="12" y="${cabezaY - 12}" font-size="12">💬</text>`;
  const [px, py] = sentado ? P(act.pos[0], act.pos[1], 0.48) : P(act.pos[0], act.pos[1], 0);
  return `<g transform="translate(${px.toFixed(1)} ${py.toFixed(1)}) scale(${espejo} 1)" class="${m}">${f}</g>`;
}

function dibujarActores() {
  const capa = document.getElementById("actores");
  if (!capa) return;
  // de atrás hacia adelante para que se tapen bien entre ellos
  capa.innerHTML = Object.values(vida.actores).sort((a, b) => a.pos[0] + a.pos[1] - (b.pos[0] + b.pos[1])).map(figura).join("");
}

function cicloVida(t) {
  if (!document.getElementById("actores")) { vida.raf = null; return; }
  if (!document.hidden && t - (vida.dibujado || 0) > 33) { avanzarVida(t); dibujarActores(); vida.dibujado = t; }
  vida.raf = requestAnimationFrame(cicloVida);
}

// Con datos nuevos: actualiza el estado real de cada uno (el que tenía otra cosa, cambia de plan enseguida).
function actualizarActores(agentes) {
  const quieto = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const ahora = performance.now();
  for (const a of agentes) {
    let act = vida.actores[a.id];
    if (!act) {
      act = vida.actores[a.id] = { id: a.id, estado: a.estado, pos: silla(a.id), modo: "sentado-teclea", hasta: 0, lugar: null };
      act.hasta = ahora + azar(0, 4000); // que no arranquen todos a la vez
    }
    if (act.estado !== a.estado) { act.estado = a.estado; if (act.modo !== "caminando") act.hasta = 0; }
    if (quieto) { // sin animación: cada uno en la pose de su estado, en su puesto
      act.lugar = null; act.camino = [];
      act.modo = { trabajando: "sentado-teclea", esperando: "parado-espera", descanso: "sentado-taza", error: "sentado-error" }[a.estado];
      act.pos = act.modo === "parado-espera" ? alLado(a.id) : silla(a.id);
      act.hasta = Infinity;
    }
  }
  dibujarActores();
  if (!vida.raf && !quieto) vida.raf = requestAnimationFrame(cicloVida);
}

function salaOficina(agentes) {
  const L = 20.5, D = 10, H = 3.4; // largo (x), fondo (y) y alto de la sala
  let s = "";
  // paredes del fondo
  s += poli("#dfe3ea", P(0, 0, 0), P(L, 0, 0), P(L, 0, H), P(0, 0, H));
  s += poli("#c9ced8", P(0, 0, 0), P(0, D, 0), P(0, D, H), P(0, 0, H));
  s += caja(-0.25, -0.25, H, L + 0.25, 0.25, 0.12, "#f8f9fa", "#e9ecef", "#dee2e6") + caja(-0.25, 0, H, 0.25, D, 0.12, "#f8f9fa", "#e9ecef", "#dee2e6");
  // ventanales en la pared del fondo
  for (let k = 0; k < 7; k++) {
    const x = 5.6 + k * 2.1;
    s += poli("#f1f3f5", P(x - 0.08, 0, 0.55), P(x + 1.78, 0, 0.55), P(x + 1.78, 0, 3.05), P(x - 0.08, 0, 3.05));
    s += poli("#4d7ea8", P(x, 0, 0.62), P(x + 1.7, 0, 0.62), P(x + 1.7, 0, 2.98), P(x, 0, 2.98));
    s += poli("#7fa7c9", P(x + 0.2, 0, 0.62), P(x + 0.7, 0, 0.62), P(x + 1.3, 0, 2.98), P(x + 0.8, 0, 2.98));
  }
  // pizarrón con post-its en la pared izquierda
  s += poli("#8d6e63", P(0, 1.2, 1.1), P(0, 4.6, 1.1), P(0, 4.6, 2.9), P(0, 1.2, 2.9));
  s += poli("#fdfdfd", P(0, 1.3, 1.2), P(0, 4.5, 1.2), P(0, 4.5, 2.8), P(0, 1.3, 2.8));
  [[1.6, 2.5], [2.1, 2.5], [2.6, 2.1], [3.3, 2.5], [3.9, 2.0], [1.7, 1.7], [2.4, 1.5], [4.0, 1.5]].forEach(([y, z], k) =>
    (s += poli(["#ffd166", "#ef476f", "#06d6a0", "#118ab2"][k % 4], P(0, y, z), P(0, y + 0.3, z), P(0, y + 0.3, z + 0.3), P(0, y, z + 0.3))));
  { const [tx, ty] = P(0, 3.4, 2.15); s += `<text font-size="14" font-weight="700" fill="#1d3557" text-anchor="middle" transform="translate(${tx} ${ty}) skewY(-30)">ideas</text>`; }
  // estante con libros y cuadro en la pared del fondo
  s += caja(1.2, 0, 1.9, 3.2, 0.35, 0.08, "#f8f9fa", "#dee2e6", "#e9ecef");
  [["#e63946", 0.4], ["#457b9d", 0.7], ["#f4a261", 0.95], ["#2a9d8f", 1.4], ["#8e7dbe", 1.65]].forEach(([c, x]) => (s += caja(1.2 + x, 0.05, 1.98, 0.18, 0.25, 0.42, c, c, c)));
  s += poli("#264653", P(1.4, 0, 2.6), P(3.9, 0, 2.6), P(3.9, 0, 3.1), P(1.4, 0, 3.1));
  { const [tx, ty] = P(2.65, 0, 2.77); s += `<text font-size="12" font-weight="800" fill="#ffd166" text-anchor="middle" transform="translate(${tx} ${ty}) skewY(30)">${esc((clientes.find((c) => c.id === ($("#oCliente")?.value))?.nombre || "").toUpperCase())}</text>`; }
  // piso de madera (con espesor, como una maqueta)
  s += poli("#6f4a2a", P(0, D, 0), P(L, D, 0), P(L, D, -0.3), P(0, D, -0.3)) + poli("#5c3d22", P(L, 0, 0), P(L, D, 0), P(L, D, -0.3), P(L, 0, -0.3));
  s += poli("#a47148", P(0, 0, 0), P(L, 0, 0), P(L, D, 0), P(0, D, 0));
  for (let y = 0.5; y < D; y += 0.5) { const [x1, y1] = P(0, y), [x2, y2] = P(L, y); s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#8b5e34" stroke-width="0.7" opacity=".6"/>`; }
  for (let x = 2; x < L; x += 2.7) for (let y = 0; y < D; y += 1) { const o = (y % 2) * 1.3; if (x + o >= L) continue; const [x1, y1] = P(x + o, y), [x2, y2] = P(x + o, y + 0.5); s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#8b5e34" stroke-width="0.7" opacity=".5"/>`; }
  // alfombra, máquina de café y plantas
  s += poli("#577590", P(4.2, 4.6, 0.01), P(16.4, 4.6, 0.01), P(16.4, 5.6, 0.01), P(4.2, 5.6, 0.01));
  s += caja(0.1, 7.6, 0, 0.9, 0.9, 1.0, "#6c757d", "#495057", "#5c636a") + caja(0.25, 7.75, 1.0, 0.55, 0.45, 0.5, "#212529", "#343a40", "#2b3035");
  s += planta(L - 0.9, 0.3, 1.3) + planta(0.3, 0.3, 1.1) + planta(L - 0.9, 9.2, 1.2);
  // puestos de atrás hacia adelante, los personajes (que se mueven) y arriba de todo los carteles
  const orden = [...agentes].sort((a, b) => PUESTOS[a.id][0] + PUESTOS[a.id][1] - (PUESTOS[b.id][0] + PUESTOS[b.id][1]));
  s += orden.map(puestoFijo).join("") + `<g id="actores" style="pointer-events:none"></g>` + orden.map(cartelPuesto).join("");
  // marco del dibujo según el tamaño real de la sala (con lugar para los carteles de arriba)
  const izq = P(0, D)[0] - 20, der = P(L, 0)[0] + 20, arriba = P(0, 0, H)[1] - 40, abajo = P(L, D, -0.3)[1] + 16;
  return `<svg viewBox="${izq.toFixed(0)} ${arriba.toFixed(0)} ${(der - izq).toFixed(0)} ${(abajo - arriba).toFixed(0)}" role="img" aria-label="Oficina con los agentes de IA" style="width:100%;height:auto;display:block">${s}</svg>`;
}

async function verOficina() {
  const v = $("#vista");
  v.innerHTML = `<div class="fila" style="margin-bottom:12px">
      <select id="oCliente" style="max-width:260px" ${yo.rol === "agencia" ? "" : "hidden"}>${opcionesClientes(yo.cliente_id || clientes[0]?.id)}</select>
      <span class="meta" id="oTitulo" style="color:var(--suave)"></span></div>
    <div class="tarjeta" style="padding:8px;overflow:hidden" id="oSala"></div>
    <div class="tarjeta"><h2>Qué está haciendo cada uno</h2><div id="oLista"></div></div>
    <p class="meta" style="color:var(--suave)">Tocá a un agente (en la sala o en la lista) para ver en qué está, qué hizo y qué tiene para que apruebes. Se actualiza sola.</p>
    <div class="tarjeta"><div class="fila" style="justify-content:space-between"><h2>🧑‍💼 Resumen del gerente</h2><button class="b" id="oResumen">Pedir resumen</button></div>
      <p class="meta" style="color:var(--suave)">Te llega todas las mañanas a las 8:30 por Telegram (o escribí /resumen).</p><div id="oTextoResumen" style="white-space:pre-wrap"></div></div>`;
  $("#oResumen").onclick = () => conBoton($("#oResumen"), async () => {
    $("#oTextoResumen").textContent = (await api("gerente?cliente=" + encodeURIComponent($("#oCliente").value))).texto;
  });
  $("#oCliente").onchange = () => cargar();
  let ultimo = null;
  const abrir = (el) => {
    el.onclick = () => fichaAgente(ultimo, el.dataset.agente);
    el.onkeydown = (e) => (e.key === "Enter" || e.key === " ") && fichaAgente(ultimo, el.dataset.agente);
  };
  async function cargar() {
    let o;
    try { o = await api("oficina?cliente=" + encodeURIComponent($("#oCliente").value)); } catch { return; }
    ultimo = o;
    $("#oTitulo").textContent = `Oficina de ${o.cliente.nombre} · ${o.hora} hs · ${o.agentes.filter((a) => a.estado === "trabajando").length} trabajando ahora`;
    $("#oSala").innerHTML = salaOficina(o.agentes);
    actualizarActores(o.agentes);
    $("#oLista").innerHTML = o.agentes.map((a) => `<div class="fila" data-agente="${a.id}" role="button" tabindex="0" style="cursor:pointer;padding:6px 0;border-bottom:1px solid var(--borde)">
      <b style="min-width:200px">${ICONO_AGENTE[a.id]} ${esc(a.nombre)}</b><span class="estado ${a.estado}">${esc(TEXTO_ESTADO[a.estado])}</span>
      <span class="meta" style="color:var(--suave);flex:1">${esc(a.globo || a.tarea)}</span>${a.pendientes ? `<span class="chip pendiente">${a.pendientes} para aprobar</span>` : ""}</div>`).join("");
    document.querySelectorAll("#oSala [data-agente], #oLista [data-agente]").forEach(abrir);
  }
  await cargar();
  relojOficina = setInterval(cargar, 20000);
}

async function fichaAgente(o, id) {
  const a = o.agentes.find((x) => x.id === id);
  const modal = document.createElement("div");
  modal.className = "modal";
  modal.innerHTML = `<div role="dialog" aria-label="${esc(a.nombre)}">
    <div class="fila" style="justify-content:space-between"><h2>${ICONO_AGENTE[a.id]} ${esc(a.nombre)} <span class="estado ${a.estado}">${esc(TEXTO_ESTADO[a.estado])}</span></h2>
      <button class="b" data-cerrar>Cerrar</button></div>
    <p class="meta" style="color:var(--suave)">${esc(a.tarea)} · ${esc(a.dato)}</p>
    ${a.globo ? `<div class="globo" style="margin:10px 0 14px">${esc(a.globo)}</div>` : ""}
    <p><b>Próxima tarea:</b> ${esc(a.proxima)}</p>
    <div id="fPend"></div>
    <h3>Lo último que hizo</h3>
    ${a.historial.length ? `<table><tbody>${a.historial.map((h) => `<tr><td class="meta" style="white-space:nowrap">${esc(h.creado)} UTC</td><td><span class="chip ${h.tipo === "error" ? "error" : ""}">${esc(h.tipo)}</span></td><td>${esc(h.detalle)}</td></tr>`).join("")}</tbody></table>` : '<p class="vacio">Todavía no hizo nada en los últimos 30 días.</p>'}
  </div>`;
  const cerrar = () => modal.remove();
  modal.onclick = (e) => e.target === modal && cerrar();
  $("[data-cerrar]", modal).onclick = cerrar;
  document.addEventListener("keydown", function esc_(e) { if (e.key === "Escape") { cerrar(); document.removeEventListener("keydown", esc_); } });
  document.body.append(modal);
  if (a.propuestas.length) {
    const lista = (await api(`propuestas?estado=pendiente&cliente=${encodeURIComponent(o.cliente.id)}`)).filter((p) => a.propuestas.includes(p.tipo));
    if (lista.length) {
      $("#fPend", modal).innerHTML = "<h3>Para que apruebes</h3>";
      for (const p of lista) $("#fPend", modal).append(tarjetaPropuesta(p, () => { cerrar(); ir("oficina"); }));
    }
  }
}

// ---------- seguridad
const NOMBRE_CHEQUEO = { disponible: "Disponibilidad", https: "HTTPS", encabezados: "Encabezados de seguridad", version: "Versión expuesta", certificado: "Certificado SSL",
  archivos: "Archivos expuestos", email: "Email del dominio (SPF/DMARC)", secretos: "Claves en el repositorio", accesos: "Intentos de acceso", invitaciones: "Invitaciones", conexiones: "Conexiones" };

async function verSeguridad() {
  const v = $("#vista");
  v.innerHTML = `<div class="fila" style="margin-bottom:12px">
      <select id="sCliente" style="max-width:260px" ${yo.rol === "agencia" ? "" : "hidden"}>${opcionesClientes(yo.cliente_id || clientes[0]?.id)}</select>
      <button class="b prim" id="sRevisar">Revisar ahora</button>
      <span class="meta" style="color:var(--suave)">Chequeos pasivos sobre tus propios sitios: cada 15 min, cada hora y uno profundo por día.</span></div>
    <div id="sCuerpo"></div>`;
  const cli = () => $("#sCliente").value;
  $("#sCliente").onchange = () => cargar();
  $("#sRevisar").onclick = () => conBoton($("#sRevisar"), async () => { const r = await api("seguridad/revisar", { method: "POST", body: { cliente: cli() } }); aviso(r.nota); cargar(); });
  async function cargar() {
    const { activos, hallazgos, puntaje } = await api("seguridad?cliente=" + encodeURIComponent(cli()));
    const color = puntaje >= 85 ? "var(--ok)" : puntaje >= 60 ? "var(--aviso)" : "var(--peligro)";
    const icono = { critico: "🔴", aviso: "🟡", ok: "🟢" };
    $("#sCuerpo").innerHTML = `
      <div class="grilla" style="margin-bottom:16px">
        <div class="tarjeta" style="margin:0"><div class="meta" style="color:var(--suave)">Puntaje de seguridad</div><div style="font-size:34px;font-weight:800;color:${color}">${puntaje}/100</div></div>
        <div class="tarjeta" style="margin:0"><div class="meta" style="color:var(--suave)">Críticos</div><div style="font-size:34px;font-weight:800">${hallazgos.filter((h) => h.nivel === "critico").length}</div></div>
        <div class="tarjeta" style="margin:0"><div class="meta" style="color:var(--suave)">Avisos</div><div style="font-size:34px;font-weight:800">${hallazgos.filter((h) => h.nivel === "aviso").length}</div></div>
      </div>
      <div class="tarjeta"><h2>Hallazgos</h2>${hallazgos.length ? hallazgos.map((h) => `<details style="border-bottom:1px solid var(--borde);padding:8px 0" ${h.nivel !== "ok" ? "open" : ""}>
          <summary style="cursor:pointer">${icono[h.nivel]} <b>${esc(NOMBRE_CHEQUEO[h.chequeo] || h.chequeo)}</b> · <span class="meta">${esc(h.activo)}</span></summary>
          <p style="margin:6px 0 0 24px">${esc(h.detalle)}</p>
          ${h.nivel !== "ok" && h.como ? `<p class="meta" style="margin:4px 0 0 24px;color:var(--suave)"><b>Cómo arreglarlo:</b> ${esc(h.como)}</p>` : ""}
          <p class="meta" style="margin:4px 0 0 24px;color:var(--suave)">Desde ${esc(h.primera_vez)} UTC · último chequeo ${esc(h.ultima_vez)} UTC</p></details>`).join("")
        : '<p class="vacio">Todavía no hay resultados: agregá tus sitios y tocá "Revisar ahora".</p>'}</div>
      <div class="tarjeta"><h2>Sitios vigilados</h2>
        <p class="meta" style="color:var(--suave)">Agregá solo sitios que sean tuyos (tu web, subdominios, sistemas). El agente no ataca nada: solo mira lo que cualquiera podría ver.</p>
        <table><tbody>${activos.map((a) => `<tr><td><b>${esc(a.nombre || "")}</b><br><a href="${esc(a.url)}" target="_blank" rel="noopener" class="meta">${esc(a.url)}</a></td>
          <td>${a.fallas ? "🔴 caído" : a.ms != null ? "🟢 " + a.ms + " ms" : "…"}</td><td class="meta">${esc(a.ultimo_chequeo || "")} UTC</td>
          <td><button class="b peligro" data-borrar="${esc(a.id)}">Quitar</button></td></tr>`).join("")}</tbody></table>
        <div class="fila" style="margin-top:10px"><input id="sNombre" placeholder="Nombre (ej. Mi web)" style="max-width:200px"><input id="sUrl" placeholder="https://misitio.com" style="flex:1"><button class="b prim" id="sAgregar">Agregar</button></div></div>`;
    $("#sAgregar").onclick = () => conBoton($("#sAgregar"), async () => { await api("seguridad/activos", { method: "POST", body: { cliente: cli(), url: $("#sUrl").value, nombre: $("#sNombre").value } }); aviso("Agregado y revisado"); cargar(); });
    $("#sCuerpo").querySelectorAll("[data-borrar]").forEach((b) => (b.onclick = () => conBoton(b, async () => {
      if (!confirm("¿Dejar de vigilar este sitio?")) return;
      await api("seguridad/activos/" + b.dataset.borrar, { method: "DELETE" });
      cargar();
    })));
  }
  await cargar();
}
