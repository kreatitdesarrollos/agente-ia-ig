<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel Kreatit</title>
<style>
  :root {
    --fondo: #f4f5fb; --tarjeta: #ffffff; --texto: #1b1d2e; --suave: #5d6178; --borde: #dfe1ec;
    --acento: #4b3fb0; --acento-texto: #ffffff; --ok: #1f8a4c; --peligro: #c23b3b; --aviso: #b26b00;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fondo: #12131c; --tarjeta: #1c1e2b; --texto: #eceefa; --suave: #a2a6c0; --borde: #2e3144;
      --acento: #8f84ff; --acento-texto: #12131c; --ok: #4cc884; --peligro: #ff7b7b; --aviso: #ffb648; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--fondo); color: var(--texto); }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--tarjeta); border-bottom: 1px solid var(--borde); position: sticky; top: 0; z-index: 2; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0 8px 0 0; }
  nav { display: flex; gap: 4px; flex-wrap: wrap; }
  nav button { background: none; border: 0; padding: 8px 12px; border-radius: 8px; color: var(--suave); font: inherit; cursor: pointer; }
  nav button.activo { background: var(--fondo); color: var(--texto); font-weight: 600; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .tarjeta { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .fila { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .grilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .prop img { width: 100%; border-radius: 8px; display: block; background: var(--fondo); }
  .prop .meta { color: var(--suave); font-size: 13px; margin: 8px 0; }
  label { display: block; font-size: 13px; color: var(--suave); margin: 10px 0 4px; }
  input, textarea, select { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--borde); border-radius: 8px; background: var(--fondo); color: var(--texto); }
  textarea { min-height: 120px; resize: vertical; }
  textarea.grande { min-height: 320px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  button.b { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--borde); background: var(--tarjeta); color: var(--texto); cursor: pointer; }
  button.b.prim { background: var(--acento); border-color: var(--acento); color: var(--acento-texto); font-weight: 600; }
  button.b.ok { border-color: var(--ok); color: var(--ok); }
  button.b.peligro { border-color: var(--peligro); color: var(--peligro); }
  button.b:disabled { opacity: .5; cursor: wait; }
  .chip { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--borde); color: var(--suave); }
  .chip.pendiente { border-color: var(--aviso); color: var(--aviso); }
  .chip.publicada { border-color: var(--ok); color: var(--ok); }
  .chip.error { border-color: var(--peligro); color: var(--peligro); }
  .error { color: var(--peligro); font-size: 13px; }
  .vacio { color: var(--suave); text-align: center; padding: 32px; }
  .fotos { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
  .fotos figure { margin: 0; position: relative; }
  .fotos img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; }
  .fotos figcaption { font-size: 11px; color: var(--suave); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fotos button { position: absolute; top: 4px; right: 4px; border: 0; border-radius: 99px; width: 24px; height: 24px; background: #000a; color: #fff; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { text-align: left; padding: 8px; border-bottom: 1px solid var(--borde); vertical-align: top; }
  #login { max-width: 360px; margin: 12vh auto; }
  #aviso { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--texto); color: var(--fondo); padding: 10px 16px; border-radius: 8px; display: none; z-index: 5; max-width: calc(100% - 32px); }
  h2 { font-size: 16px; margin: 0 0 8px; }
  h3 { font-size: 14px; margin: 16px 0 8px; }
</style>
</head>
<body>
<div id="login" class="tarjeta" hidden>
  <h2>Panel de la agencia</h2>
  <p>Ingresá tu usuario y te mandamos un código a tu Telegram.</p>
  <label for="usuario">Usuario</label>
  <input id="usuario" autocomplete="username" autocapitalize="none">
  <p><button class="b prim" id="pedirCodigo">Enviarme el código</button></p>
  <div id="pasoCodigo" hidden>
    <label for="codigo">Código</label>
    <input id="codigo" inputmode="numeric" autocomplete="one-time-code">
    <p><button class="b prim" id="entrar">Entrar</button></p>
  </div>
  <p class="error" id="errorLogin"></p>
</div>

<div id="app" hidden>
  <header>
    <h1>Panel</h1>
    <nav>
      <button data-vista="propuestas" class="activo">Para aprobar</button>
      <button data-vista="historial">Historial</button>
      <button data-vista="generar">Generar</button>
      <button data-vista="resultados">Resultados</button>
      <button data-vista="investigacion">Investigación</button>
      <button data-vista="leads">Leads</button>
      <button data-vista="anuncios">Anuncios</button>
      <button data-vista="comentarios">Comentarios</button>
      <button data-vista="resenas">Reseñas</button>
      <button data-vista="clientes">Clientes</button>
      <button data-vista="actividad">Actividad</button>
    </nav>
    <span style="flex:1"></span>
    <span id="quien" style="color:var(--suave);font-size:13px"></span>
    <button class="b" id="salir">Salir</button>
  </header>
  <main id="vista"></main>
</div>
<div id="aviso"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let clientes = [];
let yo = null;
let igOauth = false;

async function api(ruta, opciones = {}) {
  const r = await fetch("/api/panel/" + ruta, {
    ...opciones,
    headers: opciones.body instanceof FormData ? {} : { "Content-Type": "application/json" },
    body: opciones.body instanceof FormData ? opciones.body : opciones.body && JSON.stringify(opciones.body),
  });
  if (r.status === 401) { mostrarLogin(); throw new Error("sin sesión"); }
  const j = r.headers.get("Content-Type")?.includes("json") ? await r.json() : null;
  if (!r.ok || j?.error) throw new Error(j?.error || "error " + r.status);
  return j;
}

function aviso(texto) {
  const a = $("#aviso");
  a.textContent = texto;
  a.style.display = "block";
  clearTimeout(aviso.t);
  aviso.t = setTimeout(() => (a.style.display = "none"), 3500);
}

async function conBoton(boton, fn) {
  boton.disabled = true;
  try { await fn(); } catch (e) { aviso("⚠️ " + e.message); } finally { boton.disabled = false; }
}

// ---------- login
function mostrarLogin() { $("#app").hidden = true; $("#login").hidden = false; }
try { $("#usuario").value = localStorage.getItem("usuario") || ""; } catch {}
$("#pedirCodigo").onclick = () => conBoton($("#pedirCodigo"), async () => {
  const usuario = $("#usuario").value.trim();
  if (!usuario) return aviso("Escribí tu usuario");
  try { localStorage.setItem("usuario", usuario); } catch {}
  await fetch("/api/panel/codigo", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ usuario }) });
  $("#pasoCodigo").hidden = false;
  $("#errorLogin").textContent = "Si el usuario existe y tiene Telegram vinculado, te llegó el código.";
  $("#codigo").focus();
});
$("#entrar").onclick = () => conBoton($("#entrar"), async () => {
  const r = await fetch("/api/panel/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ usuario: $("#usuario").value.trim(), codigo: $("#codigo").value.trim() }) });
  if (!r.ok) { $("#errorLogin").textContent = (await r.json()).error; return; }
  iniciar();
});
$("#codigo").addEventListener("keydown", (e) => e.key === "Enter" && $("#entrar").click());
$("#salir").onclick = async () => { await api("salir", { method: "POST" }); mostrarLogin(); };

// ---------- navegación
document.querySelectorAll("nav button").forEach((b) => (b.onclick = () => ir(b.dataset.vista)));
function ir(vista) {
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("activo", b.dataset.vista === vista));
  try { localStorage.setItem("vista", vista); } catch {}
  ({ propuestas: () => verPropuestas("pendiente"), historial: () => verPropuestas("todas"), generar: verGenerar, resultados: verResultados, investigacion: verInvestigacion, comentarios: verComentarios, resenas: verResenas, leads: verLeads, anuncios: verAnuncios, clientes: verClientes, actividad: verActividad })[vista]();
}

async function iniciar() {
  try {
    const r = await api("resumen");
    clientes = r.clientes; yo = r.yo; igOauth = r.ig_oauth;
  } catch { return; }
  $("#login").hidden = true;
  $("#app").hidden = false;
  $("#quien").textContent = yo.nombre;
  $('nav [data-vista="clientes"]').textContent = yo.rol === "agencia" ? "Clientes" : "Mi cuenta";
  const ig = decodeURIComponent((location.hash.match(/ig=([^&]+)/) || [])[1] || "");
  if (ig) { aviso(ig); history.replaceState(null, "", location.pathname); try { localStorage.setItem("vista", "clientes"); } catch {} }
  let vista = "propuestas";
  try { vista = localStorage.getItem("vista") || vista; } catch {}
  ir(vista);
}

const opcionesClientes = (sel = "") => clientes.map((c) => `<option value="${esc(c.id)}" ${c.id === sel ? "selected" : ""}>${esc(c.nombre)}</option>`).join("");

// ---------- propuestas
async function verPropuestas(estado) {
  const v = $("#vista");
  v.innerHTML = `<div class="fila" style="margin-bottom:16px">
      <select id="filtroCliente" style="max-width:260px" ${yo.rol === "agencia" ? "" : "hidden"}><option value="">Todos los clientes</option>${opcionesClientes()}</select>
      ${estado === "todas" ? "" : '<span class="meta" style="color:var(--suave)">Posts esperando tu aprobación</span>'}
    </div><div id="lista" class="grilla"></div>`;
  $("#filtroCliente").onchange = () => cargar();
  async function cargar() {
    const lista = await api(`propuestas?estado=${estado}&cliente=${$("#filtroCliente").value}`);
    $("#lista").innerHTML = lista.length ? "" : `<div class="vacio">${estado === "pendiente" ? "No hay nada para aprobar 🎉" : "Todavía no hay historial"}</div>`;
    for (const p of lista) $("#lista").append(tarjetaPropuesta(p, cargar));
  }
  await cargar();
}

function tarjetaPropuesta(p, recargar) {
  if (p.tipo === "respuesta") return tarjetaRespuesta(p, recargar);
  if (p.tipo === "mensaje") return tarjetaMensaje(p, recargar);
  if (p.tipo === "resena") return tarjetaResena(p, recargar);
  if (p.tipo === "email") return tarjetaEmail(p, recargar);
  if (p.tipo === "anuncio") return tarjetaAnuncio(p, recargar);
  const el = document.createElement("div");
  el.className = "tarjeta prop";
  const editable = p.estado === "pendiente" || p.estado === "error";
  el.innerHTML = `
    <img src="/img/${esc(p.id)}.jpg" alt="Imagen del post" loading="lazy">
    <div class="meta"><span class="chip ${esc(p.estado)}">${esc(p.estado)}</span> ${esc(p.cliente_nombre)} · ${esc(p.creado)} UTC</div>
    <h2>${esc(p.titulo)}</h2>
    ${editable ? `<label>Texto</label><textarea class="caption">${esc(p.datos.caption)}</textarea>
      <label>Hashtags</label><input class="hashtags" value="${esc(p.datos.hashtags)}">` :
      `<p style="white-space:pre-wrap">${esc(p.datos.caption)}</p><p class="meta">${esc(p.datos.hashtags)}</p>`}
    ${p.resultado.error ? `<p class="error">${esc(p.resultado.error)}</p>` : ""}
    ${p.resultado.enlace ? `<p><a href="${esc(p.resultado.enlace)}" target="_blank" rel="noopener">Ver en Instagram ↗</a></p>` : ""}
    <div class="fila" style="margin-top:12px">${
      p.estado === "pendiente" ? `<button class="b prim" data-a="aprobar">✅ Publicar</button><button class="b" data-a="otra">🔄 Otra</button><button class="b peligro" data-a="descartar">Descartar</button>` :
      p.estado === "error" ? `<button class="b prim" data-a="reintentar">Reintentar</button><button class="b peligro" data-a="descartar">Descartar</button>` : ""}
    </div>`;
  el.querySelectorAll("[data-a]").forEach((b) => (b.onclick = () => conBoton(b, async () => {
    const cambios = editable ? { caption: $(".caption", el).value, hashtags: $(".hashtags", el).value } : {};
    const r = await api(`propuestas/${p.id}/${b.dataset.a}`, { method: "POST", body: cambios });
    aviso(r.enlace ? "🚀 Publicado" : r.nota || (b.dataset.a === "otra" ? "Generando otra versión (1–2 min)" : "Listo"));
    recargar();
  })));
  return el;
}

const ICONOS = { pregunta: "❓", elogio: "💜", queja: "⚠️", compra: "🛒", spam: "🚫", otro: "💬" };

function tarjetaRespuesta(p, recargar) {
  const d = p.datos;
  const el = document.createElement("div");
  el.className = "tarjeta prop";
  const editable = p.estado === "pendiente" || p.estado === "error";
  const ocultar = d.accion === "ocultar";
  el.innerHTML = `
    <div class="meta"><span class="chip ${esc(p.estado)}">${esc(p.estado)}</span> ${esc(p.cliente_nombre)} · ${esc(p.creado)} UTC
      ${d.urgente ? '<span class="chip error">urgente</span>' : ""}</div>
    <h2>${ICONOS[d.categoria] || "💬"} @${esc(d.usuario)} <span class="chip">${esc(d.categoria || "")}</span></h2>
    ${d.post ? `<p class="meta">En: "${esc(d.post.split("\n")[0])}"</p>` : ""}
    <p style="white-space:pre-wrap;border-left:3px solid var(--borde);padding-left:10px">${esc(d.comentario)}</p>
    ${ocultar ? `<p><b>Sugerencia:</b> ocultar el comentario (spam u ofensivo).</p>` :
      editable ? `<label>Respuesta</label><textarea class="respuesta" style="min-height:90px">${esc(d.respuesta)}</textarea>` :
      `<p><b>Respuesta:</b> ${esc(d.respuesta)}</p>`}
    ${p.resultado.error ? `<p class="error">${esc(p.resultado.error)}</p>` : ""}
    <div class="fila" style="margin-top:12px">${
      p.estado === "pendiente" ? `<button class="b prim" data-a="aprobar">${ocultar ? "🙈 Ocultar" : "✅ Responder"}</button><button class="b" data-a="otra">🔄 Otra</button><button class="b peligro" data-a="descartar">Ignorar</button>` :
      p.estado === "error" ? `<button class="b prim" data-a="reintentar">Reintentar</button><button class="b peligro" data-a="descartar">Ignorar</button>` : ""}
    </div>`;
  el.querySelectorAll("[data-a]").forEach((b) => (b.onclick = () => conBoton(b, async () => {
    const cambios = editable && !ocultar ? { respuesta: $(".respuesta", el).value } : {};
    const r = await api(`propuestas/${p.id}/${b.dataset.a}`, { method: "POST", body: cambios });
    aviso(r.nota || (b.dataset.a === "aprobar" ? "Hecho" : "Listo"));
    recargar();
  })));
  return el;
}

const INTERES = { alto: "🔥", medio: "🙂", bajo: "🧊" };

function tarjetaMensaje(p, recargar) {
  const d = p.datos;
  const el = document.createElement("div");
  el.className = "tarjeta prop";
  const editable = p.estado === "pendiente" || p.estado === "error";
  el.innerHTML = `
    <div class="meta"><span class="chip ${esc(p.estado)}">${esc(p.estado)}</span> ${esc(p.cliente_nombre)} · ${esc(p.creado)} UTC
      ${d.urgente ? '<span class="chip error">urgente</span>' : ""}</div>
    <h2>📩 @${esc(d.usuario || "alguien")} ${d.interes ? `<span class="chip">${INTERES[d.interes] || ""} interés ${esc(d.interes)}</span>` : ""}</h2>
    ${d.resumen ? `<p class="meta">${esc(d.resumen)}</p>` : ""}
    <p style="white-space:pre-wrap;border-left:3px solid var(--borde);padding-left:10px">${esc(d.entrante)}</p>
    ${editable ? `<label>Respuesta</label><textarea class="respuesta" style="min-height:90px">${esc(d.respuesta)}</textarea>` : `<p><b>Enviado:</b> ${esc(d.respuesta)}</p>`}
    ${p.resultado.error ? `<p class="error">${esc(p.resultado.error)}</p>` : ""}
    <div class="fila" style="margin-top:12px">${
      p.estado === "pendiente" ? `<button class="b prim" data-a="aprobar">✅ Enviar</button><button class="b" data-a="otra">🔄 Otra</button><button class="b peligro" data-a="descartar">Ignorar</button>` :
      p.estado === "error" ? `<button class="b prim" data-a="reintentar">Reintentar</button><button class="b peligro" data-a="descartar">Ignorar</button>` : ""}
      <button class="b" data-lead="${esc(d.contacto_id)}">Ver conversación</button>
    </div>`;
  el.querySelectorAll("[data-a]").forEach((b) => (b.onclick = () => conBoton(b, async () => {
    const r = await api(`propuestas/${p.id}/${b.dataset.a}`, { method: "POST", body: editable ? { respuesta: $(".respuesta", el).value } : {} });
    aviso(r.nota || (b.dataset.a === "aprobar" ? "Enviado" : "Listo"));
    recargar();
  })));
  $("[data-lead]", el).onclick = () => verLead(d.contacto_id);
  return el;
}

function tarjetaResena(p, recargar) {
  const d = p.datos;
  const el = document.createElement("div");
  el.className = "tarjeta prop";
  const editable = p.estado === "pendiente" || p.estado === "error";
  el.innerHTML = `
    <div class="meta"><span class="chip ${esc(p.estado)}">${esc(p.estado)}</span> ${esc(p.cliente_nombre)} · Google Play · ${esc(d.app)}
      ${d.urgente ? '<span class="chip error">urgente</span>' : ""}</div>
    <h2>${"⭐".repeat(d.estrellas || 0)} ${esc(d.autor || "Usuario")}</h2>
    <p style="white-space:pre-wrap;border-left:3px solid var(--borde);padding-left:10px">${esc(d.comentario || "(solo estrellas)")}</p>
    ${editable ? `<label>Respuesta (máx. 350)</label><textarea class="respuesta" maxlength="350" style="min-height:90px">${esc(d.respuesta)}</textarea>` : `<p><b>Respuesta:</b> ${esc(d.respuesta)}</p>`}
    ${p.resultado.error ? `<p class="error">${esc(p.resultado.error)}</p>` : ""}
    <div class="fila" style="margin-top:12px">${
      p.estado === "pendiente" ? `<button class="b prim" data-a="aprobar">✅ Responder</button><button class="b" data-a="otra">🔄 Otra</button><button class="b peligro" data-a="descartar">Ignorar</button>` :
      p.estado === "error" ? `<button class="b prim" data-a="reintentar">Reintentar</button><button class="b peligro" data-a="descartar">Ignorar</button>` : ""}</div>`;
  el.querySelectorAll("[data-a]").forEach((b) => (b.onclick = () => conBoton(b, async () => {
    const r = await api(`propuestas/${p.id}/${b.dataset.a}`, { method: "POST", body: editable ? { respuesta: $(".respuesta", el).value } : {} });
    aviso(r.nota || "Listo");
    recargar();
  })));
  return el;
}

function tarjetaEmail(p, recargar) {
  const d = p.datos;
  const el = document.createElement("div");
  el.className = "tarjeta prop";
  const editable = p.estado === "pendiente" || p.estado === "error";
  el.innerHTML = `
    <div class="meta"><span class="chip ${esc(p.estado)}">${esc(p.estado)}</span> ${esc(p.cliente_nombre)} · email ${d.paso + 1} de ${d.total}</div>
    <h2>✉️ ${esc(d.nombre || "")} &lt;${esc(d.email)}&gt;</h2>
    <p class="meta">Objetivo: ${esc(d.objetivo)}</p>
    ${editable ? `<label>Asunto</label><input class="asunto" value="${esc(d.asunto)}"><label>Cuerpo</label><textarea class="cuerpo" style="min-height:200px">${esc(d.cuerpo)}</textarea>` :
      `<p><b>${esc(d.asunto)}</b></p><p style="white-space:pre-wrap">${esc(d.cuerpo)}</p>`}
    ${p.resultado.error ? `<p class="error">${esc(p.resultado.error)}</p>` : ""}
    <div class="fila" style="margin-top:12px">${
      p.estado === "pendiente" ? `<button class="b prim" data-a="aprobar">✅ Enviar</button><button class="b" data-a="otra">🔄 Otro</button><button class="b peligro" data-a="descartar">Saltear</button>` :
      p.estado === "error" ? `<button class="b prim" data-a="reintentar">Reintentar</button><button class="b peligro" data-a="descartar">Saltear</button>` : ""}
      <button class="b" data-lead="${esc(d.contacto_id)}">Ver lead</button></div>`;
  el.querySelectorAll("[data-a]").forEach((b) => (b.onclick = () => conBoton(b, async () => {
    const r = await api(`propuestas/${p.id}/${b.dataset.a}`, { method: "POST", body: editable ? { asunto: $(".asunto", el).value, cuerpo: $(".cuerpo", el).value } : {} });
    aviso(r.error || r.nota || (b.dataset.a === "aprobar" ? "Enviado" : "Listo"));
    recargar();
  })));
  $("[data-lead]", el).onclick = () => verLead(d.contacto_id);
  return el;
}

function tarjetaAnuncio(p, recargar) {
  const d = p.datos;
  const el = document.createElement("div");
  el.className = "tarjeta prop";
  el.innerHTML = `
    <div class="meta"><span class="chip ${esc(p.estado)}">${esc(p.estado)}</span> ${esc(p.cliente_nombre)} · campaña propuesta</div>

    const lista = (titulo, items, d) => items?.length ? `<h3>${titulo}</h3><ul>${items.map((x) => `<li>${conLinks(x, d)}</li>`).join("")}</ul>` : "";
    $("#iInformes").innerHTML = informes.length ? informes.map((inf) => {
      const d = inf.datos;
      return `<div class="tarjeta"><h2>Informe del ${esc(inf.creado.slice(0, 10))}</h2>
        <p>${conLinks(d.resumen || "", d)}</p>
        ${lista("🏁 Competencia", d.competencia, d)}${lista("📈 Tendencias y oportunidades", d.tendencias, d)}${lista("📅 Fechas para aprovechar", d.fechas, d)}

          <div style="flex:1"><b>${esc(idea.titulo)}</b><br><span class="meta" style="color:var(--suave)">${conLinks(idea.enfoque, d)}</span></div>
          <button class="b" data-idea="${inf.id}/${n}">✨ Generar este post</button></div>`).join("")}
        <details><summary style="cursor:pointer;color:var(--suave);font-size:13px">Fuentes (${(d.fuentes || []).length})</summary><ol>${
          (d.fuentes || []).map((f) => `<li><a href="${esc(f.link)}" target="_blank" rel="noopener">${esc(f.titulo)}</a> <span class="meta">— ${esc(f.fuente)}, ${esc(f.fecha)}</span></li>`).join("")}</ol></details>
      </div>`;
    }).join("") : '<div class="tarjeta vacio">Todavía no hay informes. Cargá temas o competidores y tocá "Investigar ahora".</div>';
    $("#iInformes").querySelectorAll("[data-idea]").forEach((b) => (b.onclick = () => conBoton(b, async () => {
      const [inf, n] = b.dataset.idea.split("/");

      aviso("Generando el post: llega a 'Para aprobar' y a Telegram en 1–2 minutos");

  await cargar();

    const lista = await api("comentarios?cliente=" + encodeURIComponent(yo.rol === "agencia" ? $("#coCliente").value : yo.cliente_id));
    $("#coLista").innerHTML = lista.length ? `<table><thead><tr><th>Fecha</th><th>Cliente</th><th>Quién</th><th>Comentario</th><th>Tipo</th><th>Estado</th></tr></thead><tbody>${
      lista.map((c) => `<tr><td>${esc((c.fecha || "").slice(0, 16).replace("T", " "))}</td><td>${esc(c.cliente_nombre)}</td><td>@${esc(c.usuario)}</td>
        <td>${c.enlace ? `<a href="${esc(c.enlace)}" target="_blank" rel="noopener">${esc(c.texto)}</a>` : esc(c.texto)}</td>
        <td>${ICONOS[c.categoria] || ""} ${esc(c.categoria || "")}</td><td><span class="chip">${esc(c.estado)}</span></td></tr>`).join("")
    }</tbody></table>` : '<p class="vacio">Todavía no hay comentarios registrados.</p>';
  }
  await cargar();
}

// ---------- generar
function verGenerar() {
  $("#vista").innerHTML = `<div class="tarjeta" style="max-width:620px">
    <h2>Generar un post</h2>
    <label for="gCliente">Cliente</label><select id="gCliente">${opcionesClientes()}</select>
    <label for="gPedido">Tema (opcional)</label><input id="gPedido" placeholder="ej.: sofi, jefe de trenes, app vagon, promo de verano...">
    <p class="meta" style="color:var(--suave)">Si el tema nombra un producto con fotos cargadas, usa sus capturas. Vacío = lo que toca hoy según el calendario.</p>
    <button class="b prim" id="gBoton">Generar</button></div>`;
  $("#gBoton").onclick = () => conBoton($("#gBoton"), async () => {
    await api("generar", { method: "POST", body: { cliente: $("#gCliente").value, pedido: $("#gPedido").value } });
    aviso("Generando... te llega a Telegram y a 'Para aprobar' en 1–2 minutos");
  });
}

// ---------- clientes
async function verClientes() {
  clientes = (await api("resumen")).clientes;
  if (yo.rol !== "agencia") return editarCliente(yo.cliente_id);
  $("#vista").innerHTML = `<div class="tarjeta"><h2>Clientes</h2><table><thead><tr><th>Cliente</th><th>Instagram</th><th>Hora</th><th>Modo</th><th>Pendientes</th><th>Publicados</th><th></th></tr></thead><tbody>${
    clientes.map((c) => `<tr><td><b>${esc(c.nombre)}</b><br><span class="chip">${esc(c.id)}</span> ${c.activo ? "" : '<span class="chip">pausado</span>'}</td>
      <td>${c.ig_ok ? "✅" : "⚠️ falta"}</td><td>${esc(c.hora_post)}</td><td>${c.auto_publicar ? "automático" : "con aprobación"}</td>
      <td>${c.pendientes}</td><td>${c.publicadas}</td><td><button class="b" data-c="${esc(c.id)}">Editar</button></td></tr>`).join("")
  }</tbody></table></div>
  <div class="tarjeta" style="max-width:620px"><h2>Nuevo cliente</h2>
    <div class="fila"><input id="nId" placeholder="id corto (ej. panaderia-sol)" style="flex:1"><input id="nNombre" placeholder="Nombre" style="flex:1"><button class="b prim" id="nBoton">Crear</button></div></div>
  <div class="tarjeta"><h2>Equipo de la agencia</h2><div id="equipo"></div></div>`;
  verEquipo($("#equipo"), "");
  $("#vista").querySelectorAll("[data-c]").forEach((b) => (b.onclick = () => editarCliente(b.dataset.c)));
  $("#nBoton").onclick = () => conBoton($("#nBoton"), async () => {
    const r = await api("clientes", { method: "POST", body: { id: $("#nId").value, nombre: $("#nNombre").value } });
    editarCliente(r.id);
  });
}

async function editarCliente(id) {
  const c = await api("clientes/" + id);
  const nut = JSON.parse(c.nutricion || "{}");
  $("#vista").innerHTML = `<p ${yo.rol === "agencia" ? "" : "hidden"}><button class="b" id="volver">← Clientes</button></p>
  <div class="tarjeta"><h2>${esc(c.nombre)}</h2>
    <div class="grilla">
      <div><label>Nombre</label><input id="cNombre" value="${esc(c.nombre)}"></div>
      <div><label>Hora del post diario</label><input id="cHora" type="time" value="${esc(c.hora_post)}"></div>
      <div><label>Zona horaria</label><input id="cZona" value="${esc(c.zona)}"></div>
      <div><label>Posts</label><select id="cAuto"><option value="0">Con mi aprobación</option><option value="1" ${c.auto_publicar ? "selected" : ""}>Publicar solos</option></select></div>
      <div><label>Mensajes directos</label><select id="cAutoMsg"><option value="0">Con mi aprobación</option><option value="1" ${c.auto_mensajes ? "selected" : ""}>Responder solos (las urgencias igual te las pregunta)</option></select></div>
      <div><label>Estado</label><select id="cActivo"><option value="1">Activo</option><option value="0" ${c.activo ? "" : "selected"}>Pausado</option></select></div>
    </div>
    <h3>Instagram</h3>
    <p>${c.ig_usuario ? `✅ Conectado como <b>@${esc(c.ig_usuario)}</b>` : c.ig_error ? `⚠️ La conexión falló: ${esc(c.ig_error)}` : "⚠️ Todavía no está conectado"}</p>
    ${c.ig_usuario ? `<p><button class="b" id="cSuscribir">Activar mensajes directos</button> <span class="meta" style="color:var(--suave)">(se activa solo al conectar; usalo si los mensajes no llegan)</span></p>` : ""}
    ${igOauth ? `<p><a class="b prim" style="text-decoration:none;display:inline-block" href="/ig/conectar?cliente=${encodeURIComponent(id)}">${c.ig_usuario ? "Reconectar" : "Conectar"} Instagram</a></p>` : ""}
    <details><summary style="cursor:pointer;color:var(--suave);font-size:13px">Cargar el token a mano</summary>
    <div class="grilla">
      <div><label>IG user id</label><input id="cIgUser" value="${esc(c.ig_user_id || "")}"></div>
      <div><label>Token de Instagram ${c.ig_token ? "(ya hay uno guardado; pegá otro solo para reemplazarlo)" : ""}</label><input id="cIgToken" type="password" autocomplete="off"></div>
    </div></details>
    <h3>Marca (quién es, qué vende, tono, productos, cómo escribir)</h3>
    <textarea id="cMarca" class="grande">${esc(c.marca)}</textarea>
    <h3>Calendario semanal (JSON)</h3>
    <textarea id="cCal" class="grande" style="min-height:220px">${esc(JSON.stringify(JSON.parse(c.calendario || "{}"), null, 2))}</textarea>
    <p><button class="b prim" id="cGuardar">Guardar</button></p>
  </div>
  <div class="tarjeta"><h2>Fotos y capturas por producto</h2>
    <p class="meta" style="color:var(--suave)">El producto es lo que escribís en /nuevo (ej. "sofi"). Dejalo vacío para fotos propias sueltas (días con foto_propia).</p>
    <div class="fila"><input id="fProducto" placeholder="producto" style="max-width:220px"><input id="fArchivos" type="file" accept="image/*" multiple style="max-width:320px"><button class="b prim" id="fSubir">Subir</button></div>
    <div id="fotos"></div>
  </div>
  <div class="tarjeta"><h2>Google Play (reseñas)</h2>
    <label>Apps (nombre del paquete, uno por línea — ej. ar.com.kreatit)</label>
    <textarea id="cPlayApps" style="min-height:70px">${esc(JSON.parse(c.play_apps || "[]").join("\n"))}</textarea>
    <label>Cuenta de servicio de Google ${c.play_cuenta ? "(ya hay una guardada; subí otra solo para reemplazarla)" : ""}</label>
    <input id="cPlayArchivo" type="file" accept=".json,application/json">
    <p class="fila"><button class="b prim" id="cPlayGuardar">Guardar Google Play</button><button class="b" id="cPlayProbar">Probar conexión</button></p>
    <p class="meta" id="cPlayEstado" style="color:var(--suave)"></p></div>
  <div class="tarjeta"><h2>Anuncios de Meta</h2>
    <div class="grilla">
      <div><label>ID de la cuenta publicitaria</label><input id="aCuenta" value="${esc(c.ads_cuenta || "")}" placeholder="act_1234567890"></div>
      <div><label>ID de la página de Facebook</label><input id="aPagina" value="${esc(c.ads_pagina || "")}"></div>
      <div><label>Tope de presupuesto diario (${esc(c.ads_moneda || "moneda de la cuenta")})</label><input id="aTope" type="number" min="0" value="${esc(c.ads_tope_diario || 0)}"></div>
      <div><label>Link de destino por defecto</label><input id="aLink" value="${esc(c.ads_link || "")}" placeholder="https://..."></div>
      <div><label>Token de acceso ${c.ads_token ? "(ya hay uno guardado; pegá otro solo para reemplazarlo)" : "(usuario del sistema del Business Manager)"}</label><input id="aToken" type="password" autocomplete="off"></div>
    </div>
    <p class="fila"><button class="b prim" id="aGuardar">Guardar anuncios</button><button class="b" id="aProbar">Probar conexión</button></p>
    <p class="meta" id="aEstado" style="color:var(--suave)"></p></div>
  <div class="tarjeta"><h2>Nutrición por email</h2>
    <p class="meta" style="color:var(--suave)">Los leads con email reciben esta secuencia hasta que pasan a "cliente" o "perdido", o se dan de baja. Se envía con Brevo desde el dominio del cliente (tiene que estar verificado en Brevo).</p>
    <div class="grilla">
      <div><label>Estado</label><select id="nActivo"><option value="0">Apagada</option><option value="1" ${nut.activo ? "selected" : ""}>Activa</option></select></div>
      <div><label>Modo</label><select id="nAuto"><option value="0">Con mi aprobación</option><option value="1" ${nut.auto ? "selected" : ""}>Enviar solos</option></select></div>
      <div><label>Nombre del remitente</label><input id="nNombre" value="${esc(nut.remitente_nombre || c.nombre)}"></div>
      <div><label>Email del remitente</label><input id="nEmail" value="${esc(nut.remitente_email || "")}" placeholder="hola@sudominio.com"></div>
      <div><label>Las respuestas van a</label><input id="nResp" value="${esc(nut.responder_a || "")}" placeholder="email real donde leer las respuestas"></div>
    </div>
    <h3>Pasos</h3><div id="nPasos"></div>
    <p class="fila"><button class="b" id="nAgregar">+ Agregar paso</button><button class="b prim" id="nGuardar">Guardar nutrición</button></p></div>
  <div class="tarjeta"><h2>Formulario web de contacto</h2>
    <p class="meta" style="color:var(--suave)">Pegá esto en la web del cliente: los datos llegan como leads al panel y avisan por Telegram.</p>
    <textarea readonly class="grande" style="min-height:150px" onclick="this.select()">${esc(`<form action="${location.origin}/lead/${id}" method="post">
  <input name="nombre" placeholder="Nombre">
  <input name="email" type="email" placeholder="Email">
  <input name="telefono" placeholder="Teléfono">
  <textarea name="mensaje" placeholder="¿En qué te podemos ayudar?"></textarea>
  <input name="website" style="display:none" tabindex="-1" autocomplete="off">
  <button>Enviar</button>
</form>`)}</textarea></div>
  <div class="tarjeta"><h2>Equipo</h2>
    <p class="meta" style="color:var(--suave)">Las personas que pueden entrar a este panel y aprobar los posts por Telegram.</p>
    <div id="equipo"></div></div>`;
  verEquipo($("#equipo"), id);
  $("#volver").onclick = verClientes;
  let pasos = (nut.pasos || []).map((p) => ({ ...p }));
  const dibujarPasos = () => {
    $("#nPasos").innerHTML = pasos.map((p, i) => `<div class="fila" style="margin-bottom:8px;align-items:flex-start">
      <div style="width:110px"><label style="margin-top:0">Día</label><input type="number" min="0" data-pd="${i}" value="${esc(p.dias)}"></div>
      <div style="flex:1;min-width:200px"><label style="margin-top:0">Objetivo del email ${i + 1}</label><input data-po="${i}" value="${esc(p.objetivo)}"></div>
      <button class="b peligro" data-pq="${i}" style="margin-top:22px">×</button></div>`).join("") || '<p class="meta">Sin pasos.</p>';
    $("#nPasos").querySelectorAll("[data-pd]").forEach((x) => (x.oninput = () => (pasos[x.dataset.pd].dias = Number(x.value))));
    $("#nPasos").querySelectorAll("[data-po]").forEach((x) => (x.oninput = () => (pasos[x.dataset.po].objetivo = x.value)));
    $("#nPasos").querySelectorAll("[data-pq]").forEach((x) => (x.onclick = () => { pasos.splice(Number(x.dataset.pq), 1); dibujarPasos(); }));
  };
  dibujarPasos();
  $("#nAgregar").onclick = () => { pasos.push({ dias: (pasos.at(-1)?.dias || 0) + 3, objetivo: "" }); dibujarPasos(); };
  $("#nGuardar").onclick = () => conBoton($("#nGuardar"), async () => {
    pasos.sort((a, b) => a.dias - b.dias);
    if ($("#nActivo").value === "1" && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test($("#nEmail").value.trim())) throw new Error("Falta el email del remitente");
    await api("clientes/" + id, { method: "PUT", body: { nutricion: JSON.stringify({
      activo: $("#nActivo").value === "1", auto: $("#nAuto").value === "1", remitente_nombre: $("#nNombre").value.trim(),
      remitente_email: $("#nEmail").value.trim(), responder_a: $("#nResp").value.trim(), pasos: pasos.filter((p) => p.objetivo.trim()),
    }) } });
    aviso("Nutrición guardada");
    dibujarPasos();
  });
  $("#aGuardar").onclick = () => conBoton($("#aGuardar"), async () => {
    await api(`clientes/${id}/ads`, { method: "POST", body: { cuenta: $("#aCuenta").value.trim(), pagina: $("#aPagina").value.trim(), tope: Number($("#aTope").value), link: $("#aLink").value.trim(), token: $("#aToken").value || undefined } });
    $("#aToken").value = "";
    aviso("Anuncios guardados");
  });
  $("#aProbar").onclick = () => conBoton($("#aProbar"), async () => {
    const r = await api(`clientes/${id}/ads/probar`, { method: "POST", body: {} });
    $("#aEstado").textContent = r.error || `✅ ${r.cuenta} (${r.moneda}, ${r.estado})${r.pagina ? " · página: " + r.pagina : " · ⚠️ falta la página"}`;
  });
  $("#cPlayGuardar").onclick = () => conBoton($("#cPlayGuardar"), async () => {
    const apps = $("#cPlayApps").value.split("\n").map((x) => x.trim()).filter(Boolean);
    await api("clientes/" + id, { method: "PUT", body: { play_apps: JSON.stringify(apps) } });
    const archivo = $("#cPlayArchivo").files[0];
    if (archivo) {
      const r = await api(`clientes/${id}/play`, { method: "POST", body: { cuenta: await archivo.text() } });
      $("#cPlayEstado").textContent = "Cuenta guardada: " + r.email;
    }
    aviso("Google Play guardado");
  });
  $("#cPlayProbar").onclick = () => conBoton($("#cPlayProbar"), async () => {
    const r = await api(`clientes/${id}/play/probar`, { method: "POST", body: {} });
    $("#cPlayEstado").textContent = r.error || r.apps.map((a) => a.ok ? `✅ ${a.app}: conectada (${a.resenas} reseñas de la última semana)` : `⚠️ ${a.app}: ${a.error}`).join(" · ");
  });
  if ($("#cSuscribir")) $("#cSuscribir").onclick = () => conBoton($("#cSuscribir"), async () => {
    await api(`clientes/${id}/suscribir`, { method: "POST", body: {} });
    aviso("Mensajes directos activados");
  });
  $("#cGuardar").onclick = () => conBoton($("#cGuardar"), async () => {
    let cal;
    try { cal = JSON.stringify(JSON.parse($("#cCal").value)); } catch { throw new Error("El calendario no es JSON válido"); }
    await api("clientes/" + id, { method: "PUT", body: {
      nombre: $("#cNombre").value, hora_post: $("#cHora").value, zona: $("#cZona").value,
      auto_publicar: Number($("#cAuto").value), auto_mensajes: Number($("#cAutoMsg").value), activo: Number($("#cActivo").value), ig_user_id: $("#cIgUser").value || null,
      ig_token: $("#cIgToken").value || undefined, marca: $("#cMarca").value, calendario: cal,
    } });
    aviso("Guardado");
  });
  $("#fSubir").onclick = () => conBoton($("#fSubir"), async () => {
    for (const archivo of $("#fArchivos").files) {
      const f = new FormData();
      f.append("cliente", id); f.append("producto", $("#fProducto").value); f.append("archivo", archivo);
      await api("fotos", { method: "POST", body: f });
    }
    $("#fArchivos").value = "";
    cargarFotos();
  });
  async function cargarFotos() {
    const fotos = await api("fotos?cliente=" + id);
    const grupos = {};
    for (const f of fotos) (grupos[f.producto || "(fotos propias)"] ||= []).push(f);
    $("#fotos").innerHTML = Object.keys(grupos).length ? Object.entries(grupos).map(([prod, fs]) => `<h3>${esc(prod)}</h3><div class="fotos">${
      fs.map((f) => `<figure><img src="/api/panel/fotos/${esc(f.id)}" alt="${esc(f.nombre)}" loading="lazy"><figcaption>${esc(f.nombre)}</figcaption><button data-f="${esc(f.id)}" title="Borrar">×</button></figure>`).join("")
    }</div>`).join("") : '<div class="vacio">Sin fotos todavía</div>';
    $("#fotos").querySelectorAll("[data-f]").forEach((b) => (b.onclick = () => conBoton(b, async () => {
      if (!confirm("¿Borrar esta foto?")) return;
      await api("fotos/" + b.dataset.f, { method: "DELETE" });
      cargarFotos();
    })));
  }
  cargarFotos();
}

// ---------- equipo
async function verEquipo(el, cliente) {
  const usuarios = await api("usuarios?cliente=" + encodeURIComponent(cliente));
  el.innerHTML = `<table><thead><tr><th>Nombre</th><th>Usuario</th><th>Telegram</th><th>Recibe posts</th><th></th></tr></thead><tbody>${
    usuarios.map((u) => `<tr><td>${esc(u.nombre)}</td><td>${esc(u.usuario)}</td>
      <td>${u.vinculado ? "✅ vinculado" : u.link ? `<button class="b" data-copiar="${esc(u.link)}">Copiar invitación</button>` : "—"}
        ${u.vinculado ? `<button class="b" data-reinv="${esc(u.id)}" title="Si cambió de Telegram">Nueva invitación</button>` : ""}</td>
      <td><input type="checkbox" data-previas="${esc(u.id)}" ${u.recibe_previas ? "checked" : ""} style="width:auto"></td>
      <td>${u.usuario === yo.usuario ? "" : `<button class="b peligro" data-borrar="${esc(u.id)}">Quitar</button>`}</td></tr>`).join("")
  }</tbody></table>
  <h3>Invitar a alguien</h3>
  <div class="fila"><input class="iNombre" placeholder="Nombre" style="flex:1"><input class="iUsuario" placeholder="Usuario para entrar (ej. su email)" style="flex:1" autocapitalize="none"><button class="b prim iBoton">Invitar</button></div>
  <p class="meta" style="color:var(--suave)">Le pasás el link de invitación (WhatsApp, mail…). Lo abre, toca "Iniciar" en Telegram y ya puede entrar al panel con su usuario.</p>`;
  el.querySelectorAll("[data-copiar]").forEach((b) => (b.onclick = async () => {
    try { await navigator.clipboard.writeText(b.dataset.copiar); aviso("Link copiado"); } catch { prompt("Copiá el link:", b.dataset.copiar); }
  }));
  el.querySelectorAll("[data-reinv]").forEach((b) => (b.onclick = () => conBoton(b, async () => {
    if (!confirm("Se desvincula su Telegram actual y se genera un link nuevo. ¿Seguir?")) return;
    await api(`usuarios/${b.dataset.reinv}/invitacion`, { method: "POST", body: {} });
    verEquipo(el, cliente);
  })));
  el.querySelectorAll("[data-previas]").forEach((c) => (c.onchange = () => api("usuarios/" + c.dataset.previas, { method: "PUT", body: { recibe_previas: c.checked } }).then(() => aviso("Guardado"))));
  el.querySelectorAll("[data-borrar]").forEach((b) => (b.onclick = () => conBoton(b, async () => {
    if (!confirm("¿Quitarle el acceso?")) return;
    await api("usuarios/" + b.dataset.borrar, { method: "DELETE" });
    verEquipo(el, cliente);
  })));
  $(".iBoton", el).onclick = () => conBoton($(".iBoton", el), async () => {
    await api("usuarios", { method: "POST", body: { cliente: cliente || null, nombre: $(".iNombre", el).value, usuario: $(".iUsuario", el).value } });
    aviso("Listo: copiá el link de invitación y pasáselo");
    verEquipo(el, cliente);
  });
}

// ---------- actividad
async function verActividad() {
  const ev = await api("eventos");
  $("#vista").innerHTML = `<div class="tarjeta"><h2>Actividad</h2><table><thead><tr><th>Cuándo (UTC)</th><th>Cliente</th><th>Qué</th><th>Detalle</th></tr></thead><tbody>${
    ev.map((e) => `<tr><td>${esc(e.creado)}</td><td>${esc(e.cliente_id)}</td><td><span class="chip ${e.tipo === "error" ? "error" : e.tipo === "publicada" ? "publicada" : ""}">${esc(e.tipo)}</span></td><td>${esc(e.detalle)}</td></tr>`).join("")
  }</tbody></table></div>`;
}

iniciar();
</script>
</body>
</html>
